<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Campaign Task Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #F9F9F6;
    --surface: #FFFFFF;
    --text: #2A2A2E;
    --text-secondary: #7C7C82;
    --text-tertiary: #A8A8AC;
    --border: #E6E6E2;
    --border-light: #F0F0EC;
    --accent: #4A6FA5;
    --accent-hover: #3D5E8C;
    --priority-high: #C45240;
    --priority-high-bg: #C4524012;
    --priority-medium: #C89B2A;
    --priority-medium-bg: #C89B2A12;
    --priority-low: #6B956B;
    --priority-low-bg: #6B956B12;
    --done-text: #B8B8BC;
    --done-line: #CCCCD0;
    --team-bg: #F2F2EE;
    --hover: #F4F4F0;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #18181B;
      --surface: #1E1E22;
      --text: #E4E4E0;
      --text-secondary: #8E8E92;
      --text-tertiary: #5A5A5E;
      --border: #2E2E32;
      --border-light: #262628;
      --accent: #6B8FC4;
      --accent-hover: #7DA0D0;
      --priority-high: #D4705F;
      --priority-high-bg: #D4705F18;
      --priority-medium: #D4AD4A;
      --priority-medium-bg: #D4AD4A18;
      --priority-low: #7DAF7D;
      --priority-low-bg: #7DAF7D18;
      --done-text: #4A4A4E;
      --done-line: #3A3A3E;
      --team-bg: #222226;
      --hover: #24242A;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--ground);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .auth-gate {
    min-height: calc(100vh - 52px); display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .auth-card { max-width: 340px; width: 100%; display: flex; flex-direction: column; gap: 14px; }
  .auth-title { font-family: Georgia, 'Times New Roman', serif; font-size: 20px; font-weight: normal; }
  .auth-sub { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
  .auth-input {
    font-family: inherit; font-size: 14px; color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 3px; padding: 10px 12px; width: 100%; outline: none;
  }
  .auth-input:focus { border-color: var(--accent); }
  .auth-btn {
    font-family: inherit; font-size: 13px; font-weight: 500;
    color: var(--surface); background: var(--accent);
    border: 1px solid var(--accent); border-radius: 3px;
    padding: 10px 16px; cursor: pointer; width: 100%;
  }
  .auth-btn:hover { background: var(--accent-hover); }
  .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .auth-error { font-size: 13px; color: var(--priority-high); line-height: 1.5; }

  .site-nav {
    display: flex; align-items: center; gap: 2px;
    max-width: 860px; margin: 0 auto;
    padding: 16px 24px 0;
  }
  .site-nav a {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-tertiary); text-decoration: none;
    padding: 5px 10px; border-bottom: 2px solid transparent;
  }
  .site-nav a:hover { color: var(--text-secondary); }
  .site-nav a.active { color: var(--text); border-bottom-color: var(--accent); }

  .app {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  .setup-banner {
    background: var(--priority-high-bg);
    border: 1px solid var(--priority-high);
    border-radius: 3px;
    padding: 12px 16px;
    margin-bottom: 24px;
    font-size: 13px;
    color: var(--text);
    line-height: 1.6;
  }
  .setup-banner code {
    background: var(--team-bg);
    padding: 1px 4px;
    border-radius: 2px;
    font-size: 12px;
  }

  .save-indicator {
    position: absolute; right: 100%; top: 50%; transform: translateY(-50%);
    display: flex; align-items: center; gap: 6px; margin-right: 10px; white-space: nowrap;
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px;
    letter-spacing: 0.03em; color: var(--text-secondary);
    opacity: 0; transition: opacity 0.2s ease; pointer-events: none;
  }
  .save-indicator.visible { opacity: 1; }
  .save-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-secondary);
    transition: background 0.2s ease;
  }
  .save-indicator.saving .save-dot {
    background: var(--priority-medium);
    animation: pulse-dot 0.8s ease-in-out infinite;
  }
  .save-indicator.saving { color: var(--priority-medium); }
  .save-indicator.saved .save-dot { background: var(--priority-low); }
  .save-indicator.saved { color: var(--priority-low); }
  .save-indicator.error .save-dot { background: var(--priority-high); }
  .save-indicator.error { color: var(--priority-high); }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 32px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .campaign-name {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 22px;
    font-weight: normal;
    color: var(--text);
    background: none;
    border: none;
    outline: none;
    padding: 0;
    width: 100%;
    max-width: 400px;
  }
  .campaign-name::placeholder { color: var(--text-tertiary); }
  .header-right {
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  .task-count {
    font-size: 12px;
    color: var(--text-tertiary);
    letter-spacing: 0.03em;
    font-variant-numeric: tabular-nums;
  }

  .team-section { margin-bottom: 28px; }
  .team-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
    padding: 6px 0;
    color: var(--text-secondary);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .team-toggle:hover { color: var(--text); }
  .team-toggle .arrow {
    display: inline-block;
    transition: transform 0.15s ease;
    font-size: 9px;
  }
  .team-toggle .arrow.open { transform: rotate(90deg); }
  .team-avatars { display: flex; gap: 4px; margin-left: 8px; }
  .team-avatar-small {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--team-bg); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 600; color: var(--text-secondary);
    letter-spacing: -0.02em;
  }
  .team-panel { display: none; padding: 12px 0; }
  .team-panel.open { display: block; }
  .team-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .team-member {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 10px; background: var(--team-bg);
    border: 1px solid var(--border-light); border-radius: 3px;
    font-size: 13px; color: var(--text); cursor: default;
  }
  .team-member .remove {
    color: var(--text-tertiary); cursor: pointer;
    font-size: 14px; line-height: 1; padding: 0 2px;
  }
  .team-member .remove:hover { color: var(--priority-high); }
  .add-member-row { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
  .add-member-input {
    font-family: inherit; font-size: 13px; padding: 5px 8px;
    border: 1px solid var(--border); border-radius: 3px;
    background: var(--surface); color: var(--text); outline: none; width: 180px;
  }
  .add-member-input:focus { border-color: var(--accent); }
  .add-member-input::placeholder { color: var(--text-tertiary); }
  .add-member-btn {
    font-family: inherit; font-size: 12px; padding: 5px 10px;
    border: 1px solid var(--border); border-radius: 3px;
    background: var(--surface); color: var(--text-secondary); cursor: pointer;
  }
  .add-member-btn:hover { border-color: var(--accent); color: var(--accent); }
  .team-limit-note { font-size: 11px; color: var(--text-tertiary); margin-top: 6px; }

  .task-list-header {
    display: grid;
    grid-template-columns: 16px 28px 1fr 128px 90px 100px 80px 28px;
    gap: 8px; align-items: center; padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 11px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text-tertiary); user-select: none;
  }
  .task-list-header span { cursor: pointer; }
  .task-list-header span:hover { color: var(--text-secondary); }

  .task-row {
    display: grid;
    grid-template-columns: 16px 28px 1fr 128px 90px 100px 80px 28px;
    gap: 8px; align-items: center; padding: 7px 0;
    border-bottom: 1px solid var(--border-light);
    transition: background 0.1s ease;
  }
  .task-row:hover { background: var(--hover); }

  /* Drag to reorder */
  .task-grip {
    color: var(--text-tertiary); cursor: grab; user-select: none;
    font-size: 11px; line-height: 1; letter-spacing: -2px;
    opacity: 0; transition: opacity 0.1s ease; text-align: center;
  }
  .task-row:hover .task-grip { opacity: 1; }
  .task-row.dragging { opacity: 0.4; }
  .task-row.dragging .task-grip { cursor: grabbing; }
  .task-row.drop-above { box-shadow: inset 0 2px 0 0 var(--accent); }
  .task-row.drop-below { box-shadow: inset 0 -2px 0 0 var(--accent); }
  .task-row.done .task-name-input { text-decoration: line-through; color: var(--done-text); }
  .task-row.done .task-due,
  .task-row.done .assignee-cell,
  .task-row.done .task-priority-btn { opacity: 0.4; }

  .task-check {
    width: 16px; height: 16px; border: 1.5px solid var(--border);
    border-radius: 2px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s ease; background: transparent; margin: 0 auto;
  }
  .task-check:hover { border-color: var(--accent); }
  .task-check.checked { background: var(--accent); border-color: var(--accent); }
  .task-check.checked::after {
    content: ''; width: 8px; height: 5px;
    border-left: 1.5px solid #fff; border-bottom: 1.5px solid #fff;
    transform: rotate(-45deg) translateY(-1px);
  }

  .task-name-input {
    font-family: inherit; font-size: 14px; color: var(--text);
    background: none; border: none; outline: none; width: 100%; padding: 1px 0;
  }
  .task-name-input::placeholder { color: var(--text-tertiary); }

  .task-due {
    font-family: inherit; font-size: 13px; font-variant-numeric: tabular-nums;
    color: var(--text-secondary); background: none; border: none;
    outline: none; cursor: pointer; padding: 2px 0; position: relative;
  }
  .task-due::-webkit-calendar-picker-indicator {
    opacity: 0; position: absolute; width: 100%; height: 100%; cursor: pointer;
  }
  /* No due date: hide the mm/dd/yyyy spinner text and show an em dash, so an
     unset date matches the other empty cells instead of shouting a format. */
  .task-due.no-date::-webkit-datetime-edit { opacity: 0; }
  .task-due.no-date { color: var(--text-tertiary); }
  .due-wrap { position: relative; display: flex; align-items: center; }
  .due-wrap .due-dash {
    position: absolute; left: 0; pointer-events: none;
    font-size: 13px; color: var(--text-tertiary);
  }
  .task-row:hover .due-wrap .due-dash { color: var(--text-secondary); }

  .assignee-cell {
    display: flex; align-items: center; gap: 3px;
    min-width: 0; cursor: pointer; padding: 2px 0;
  }
  .assignee-av {
    width: 21px; height: 21px; border-radius: 50%; flex-shrink: 0;
    background: var(--team-bg); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 600; color: var(--text-secondary);
    letter-spacing: -0.02em;
  }
  /* Past three, collapse to a count rather than letting the column grow. */
  .assignee-more {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px; color: var(--text-tertiary); margin-left: 1px;
  }
  .assignee-empty { font-size: 12px; color: var(--text-tertiary); opacity: 0; transition: opacity .12s; }
  .task-row:hover .assignee-empty { opacity: 1; }

  .assign-opt {
    display: flex; align-items: center; gap: 8px;
    font-family: inherit; font-size: 13px;
    color: var(--text-secondary); background: none; border: none;
    border-radius: 3px; padding: 5px 6px; cursor: pointer; text-align: left;
  }
  .assign-opt:hover { background: var(--hover); }
  .assign-opt .box {
    width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .assign-opt.on { color: var(--text); }
  .assign-opt.on .box { background: var(--accent); border-color: var(--accent); }
  .assign-none { font-size: 12px; color: var(--text-tertiary); padding: 6px; }

  .task-priority-btn {
    display: flex; align-items: center; gap: 4px;
    font-family: inherit; font-size: 11px; letter-spacing: 0.02em;
    padding: 2px 6px; border-radius: 2px; border: none; cursor: pointer;
    background: transparent; color: var(--text-secondary); text-transform: uppercase;
  }
  .task-priority-btn .dot { width: 6px; height: 6px; border-radius: 50%; }
  .task-priority-btn[data-priority="high"] .dot { background: var(--priority-high); }
  .task-priority-btn[data-priority="high"] { color: var(--priority-high); background: var(--priority-high-bg); }
  .task-priority-btn[data-priority="med"] .dot { background: var(--priority-medium); }
  .task-priority-btn[data-priority="med"] { color: var(--priority-medium); background: var(--priority-medium-bg); }
  .task-priority-btn[data-priority="low"] .dot { background: var(--priority-low); }
  .task-priority-btn[data-priority="low"] { color: var(--priority-low); background: var(--priority-low-bg); }

  .task-delete {
    color: var(--text-tertiary); cursor: pointer; font-size: 14px;
    text-align: center; opacity: 0; transition: opacity 0.1s;
    background: none; border: none; font-family: inherit;
  }
  .task-row:hover .task-delete { opacity: 1; }
  .task-delete:hover { color: var(--priority-high); }

  .add-task-row { padding: 8px 0; padding-left: 36px; }
  .add-task-btn {
    font-family: inherit; font-size: 13px; color: var(--text-tertiary);
    background: none; border: none; cursor: pointer; padding: 4px 0;
  }
  .add-task-btn:hover { color: var(--accent); }

  .filter-bar {
    display: flex; gap: 12px; align-items: center;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .filter-bar { gap: 14px; }
  .filter-btn {
    font-family: inherit; font-size: 13px; font-weight: 500;
    color: var(--text-tertiary);
    background: none; border: none; cursor: pointer;
    padding: 4px 1px 5px; letter-spacing: 0.01em;
    border-bottom: 2px solid transparent;
    transition: color .12s, border-color .12s;
  }
  .filter-btn:hover { color: var(--text-secondary); }
  .filter-btn.active {
    color: var(--text); font-weight: 600;
    border-bottom-color: var(--accent);
  }
  /* The count is supporting information, so it stays quiet even when the tab
     is active — otherwise the number competes with the label. */
  .filter-btn .cnt {
    color: var(--text-tertiary); margin-left: 5px; font-weight: 400;
    font-variant-numeric: tabular-nums;
  }
  .filter-btn.drop-target {
    color: #fff; background: var(--accent);
    border-radius: 3px; border-bottom-color: transparent; padding: 4px 8px 5px;
  }
  .filter-btn.drop-target .cnt { color: #fff; }

  /* Add / remove a tag */
  .tag-add {
    font-family: inherit; font-size: 15px; line-height: 1;
    color: var(--text-tertiary); background: none; border: none;
    cursor: pointer; padding: 3px 5px; border-radius: 3px;
  }
  .tag-add:hover { color: var(--accent); background: var(--hover); }
  .tag-new {
    font-family: inherit; font-size: 13px; color: var(--text);
    background: var(--surface); border: 1px solid var(--accent);
    border-radius: 3px; padding: 3px 8px; width: 132px; outline: none;
  }
  .tag-del {
    font-size: 13px; line-height: 1; color: var(--text-tertiary);
    background: none; border: none; cursor: pointer; padding: 0 0 0 5px;
  }
  .tag-del:hover { color: var(--priority-high); }
  .filter-sep { width: 1px; height: 14px; background: var(--border-light); }

  /* --- Category tags --- */
  /* Colours live on the tag definition in campaign_settings, not in CSS,
     because tags are user-creatable. Chips read them from --tc. */

  .tag-cell {
    display: flex; flex-wrap: wrap; gap: 3px; align-items: center;
    min-width: 0; cursor: pointer; padding: 2px 0;
  }
  .tag-chip {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 9px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--tc); border: 1px solid var(--tc);
    background: color-mix(in srgb, var(--tc) 12%, transparent);
    border-radius: 2px; padding: 1px 4px; white-space: nowrap;
  }
  .tag-empty { font-size: 12px; color: var(--text-tertiary); opacity: 0; transition: opacity .12s; }
  .task-row:hover .tag-empty { opacity: 1; }

  .tag-pop {
    position: absolute; z-index: 40;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 6px; min-width: 172px;
    box-shadow: 0 6px 20px rgba(0,0,0,.10);
    display: flex; flex-direction: column; gap: 2px;
  }
  .tag-opt {
    display: flex; align-items: center; gap: 7px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-secondary); background: none; border: none;
    border-radius: 3px; padding: 5px 6px; cursor: pointer; text-align: left;
  }
  .tag-opt:hover { background: var(--hover); }
  .tag-opt .box { width: 11px; height: 11px; border-radius: 2px; flex-shrink: 0; border: 1px solid var(--tc); }
  .tag-opt.on { color: var(--text); }
  .tag-opt.on .box { background: var(--tc); }

  .filter-btn .cnt { color: var(--text-tertiary); margin-left: 4px; }
  .filter-btn.drop-target {
    color: #fff; background: var(--accent);
    border-radius: 3px; border-bottom-color: transparent; padding: 3px 8px;
  }

  .task-due.overdue { color: var(--priority-high); }

  @media (max-width: 640px) {
    .app { padding: 24px 16px 60px; }
    .task-list-header, .task-row { grid-template-columns: 16px 24px 1fr 80px 28px; }
    .task-list-header .col-tags, .task-row .tag-cell,
    .task-list-header .col-assignee, .task-list-header .col-priority,
    .task-row .assignee-cell, .task-row .task-priority-btn { display: none; }
  }
</style>
</head>
<body>

<nav class="site-nav" id="siteNav">
  <a href="index.html" class="active">Tasks</a>
  <a href="questionnaires/index.html">Questionnaires</a>
  <a href="donors/index.html">Fundraising</a>
  <a href="calendar/index.html">Calendar</a>
  <a href="calltime/index.html">Call Time</a>
</nav>
<div class="auth-gate" id="authGate">
  <div class="auth-card">
    <div class="auth-title">Daria for Berkeley</div>
    <div class="auth-sub">Enter the campaign passphrase to continue.</div>
    <input class="auth-input" id="authPass" type="password" placeholder="Passphrase" autocomplete="current-password">
    <button class="auth-btn" id="authBtn">Sign in</button>
    <div class="auth-error" id="authError" style="display:none"></div>
  </div>
</div>


<div class="app" id="app" style="display:none">
  <div id="setupBanner"></div>

  <div class="header">
    <input class="campaign-name" id="campaignName" value="" placeholder="Campaign name">
    <div class="header-right">
      <span class="save-indicator" id="saveIndicator"><span class="save-dot"></span><span class="save-label"></span></span>
      <span class="task-count" id="taskCount"></span>
    </div>
  </div>

  <div class="team-section">
    <div class="team-toggle" id="teamToggle">
      <span class="arrow" id="teamArrow">&#9654;</span>
      <span>Team</span>
      <div class="team-avatars" id="teamAvatars"></div>
    </div>
    <div class="team-panel" id="teamPanel">
      <div class="team-list" id="teamList"></div>
      <div class="add-member-row" id="addMemberRow">
        <input class="add-member-input" id="addMemberInput" placeholder="Name" maxlength="30">
        <button class="add-member-btn" id="addMemberBtn">Add</button>
      </div>
      <div class="team-limit-note" id="teamLimitNote"></div>
    </div>
  </div>

  <div class="filter-bar" id="filterBar"></div>

  <div class="task-list-header"><div></div>
    <span></span>
    <span class="col-name">Task</span>
    <span class="col-tags">Tags</span>
    <span class="col-due">Due</span>
    <span class="col-assignee">Assigned</span>
    <span class="col-priority">Priority</span>
    <span></span>
  </div>
  <div id="taskList"></div>
  <div class="add-task-row">
    <button class="add-task-btn" id="addTaskBtn">+ Add task</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
  // ============================================================
  // SUPABASE CONFIG — paste your values from Dashboard > Settings > API
  // ============================================================

  async function addTag(label) {
    label = (label || '').trim();
    if (!label) return;
    var key = label.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
    if (!key) return;
    // Adding a name that already exists just switches to it rather than
    // creating a duplicate that looks identical and filters differently.
    if (tagDef(key)) { currentFilter = key; buildFilterBar(); renderTasks(); return; }
    TAGS.push({ key: key, label: label, color: TAG_PALETTE[TAGS.length % TAG_PALETTE.length] });
    setSaveStatus('saving');
    await saveTagDefs();
    setSaveStatus('saved');
    currentFilter = key;
    buildFilterBar(); renderTasks();
  }

  async function removeTag(key) {
    var d = tagDef(key);
    if (!d) return;
    if (!window.confirm('Delete the "' + d.label + '" tag? It will be removed from every task.')) return;
    TAGS = TAGS.filter(function (t) { return t.key !== key; });
    Object.keys(taskTags).forEach(function (id) {
      var next = taskTags[id].filter(function (k) { return k !== key; });
      if (next.length) taskTags[id] = next; else delete taskTags[id];
    });
    if (currentFilter === key) currentFilter = 'all';
    setSaveStatus('saving');
    await saveTagDefs();
    await saveTags();
    setSaveStatus('saved');
    buildFilterBar(); renderTasks();
  }

  function buildFilterBar() {
    var bar = document.getElementById('filterBar');
    if (!bar) return;
    bar.innerHTML = '';

    function chip(key, label, count, droppable) {
      var b = document.createElement('button');
      b.className = 'filter-btn' + (key === currentFilter ? ' active' : '');
      b.textContent = label;
      if (count != null) {
        var c = document.createElement('span');
        c.className = 'cnt'; c.textContent = count;
        b.appendChild(c);
      }
      b.addEventListener('click', function () {
        currentFilter = key; buildFilterBar(); renderTasks();
      });
      if (droppable) {
        b.addEventListener('dragover', function (e) {
          if (tagDragId == null || tagsFor(tagDragId).indexOf(key) >= 0) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'copy';
          b.classList.add('drop-target');
        });
        b.addEventListener('dragleave', function () { b.classList.remove('drop-target'); });
        b.addEventListener('drop', function (e) {
          e.preventDefault();
          b.classList.remove('drop-target');
          if (tagDragId == null || tagsFor(tagDragId).indexOf(key) >= 0) return;
          toggleTag(tagDragId, key);
        });
      }
      bar.appendChild(b);
    }

    // Done sits first, separated, because it is a different kind of thing from
    // the category tabs beside it.
    chip('done', 'Done', tasks.filter(function (t) { return t.done; }).length, false);
    var sep = document.createElement('div');
    sep.className = 'filter-sep';
    bar.appendChild(sep);

    chip('all', 'All', tasks.filter(function (t) { return !t.done; }).length, false);
    TAGS.forEach(function (t) {
      var n = tasks.filter(function (x) {
        return !x.done && tagsFor(x.id).indexOf(t.key) >= 0;
      }).length;
      chip(t.key, t.label, n, true);
      // Delete is offered only on the tab you are currently looking at, so the
      // bar is not littered with destructive controls.
      if (t.key === currentFilter) {
        var del = document.createElement('button');
        del.className = 'tag-del';
        del.textContent = '\u00d7';
        del.title = 'Delete this tag';
        del.addEventListener('click', function (e) { e.stopPropagation(); removeTag(t.key); });
        bar.lastChild.appendChild(del);
      }
    });

    var add = document.createElement('button');
    add.className = 'tag-add';
    add.textContent = '+';
    add.title = 'Add a tag';
    add.addEventListener('click', function () {
      var input = document.createElement('input');
      input.className = 'tag-new';
      input.placeholder = 'Tag name';
      input.maxLength = 28;
      bar.replaceChild(input, add);
      input.focus();
      var done = false;
      function commit(save) {
        if (done) return;
        done = true;
        var v = input.value;
        if (save && v.trim()) addTag(v); else buildFilterBar();
      }
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') commit(true);
        if (e.key === 'Escape') commit(false);
      });
      input.addEventListener('blur', function () { commit(true); });
    });
    bar.appendChild(add);
  }

  var tasks = [];

  function setSaveStatus(s) {

    clearTimeout(saveFadeTimer);
    el.className = 'save-indicator visible ' + s;

  function escHtml(str) {
    var d = document.createElement('div');
    d.textContent = str || '';
    // The textContent round-trip escapes & < > but leaves quotes intact, and
    // every caller interpolates the result into a double-quoted attribute
    // (value="...", data-name="..."). Without these two replacements a task
    // name containing a double quote can close the attribute and add its own —
    // e.g. `" autofocus onfocus="...` — which executes on page render.
    return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function getInitials(name) {
    return name.split(/\s+/).map(function(w) { return w[0]; }).join('').toUpperCase().slice(0, 2);
  }

  function isOverdue(dateStr) {
    if (!dateStr) return false;
    var today = new Date();
    today.setHours(0,0,0,0);
    return new Date(dateStr + 'T00:00:00') < today;
  }

  // Manual task order, persisted as a list of task ids in campaign_settings.
  // Stored there rather than as a column on `tasks` because that table is
  // shared with another app in this Supabase project — a settings key is
  // additive and cannot affect it.
  var taskOrder = [];

  function applyTaskOrder() {
    if (!taskOrder.length) return;
    var pos = {};
    taskOrder.forEach(function (id, i) { pos[id] = i; });
    tasks.sort(function (a, b) {
      var pa = pos[a.id], pb = pos[b.id];
      if (pa === undefined && pb === undefined) return a.id - b.id;
      if (pa === undefined) return 1;   // unordered (new) tasks fall to the end
      if (pb === undefined) return -1;
      return pa - pb;
    });
  }

  async function saveTaskOrder() {
    taskOrder = tasks.map(function (t) { return t.id; });
    setSaveStatus('saving');
    var r = await sb.from('campaign_settings')
      .upsert({ key: 'taskOrder', value: JSON.stringify(taskOrder) });
    setSaveStatus(r.error ? 'error' : 'saved');
  }

  // --- Supabase data layer ---

  async function loadAll() {
    setSaveStatus('saving');
    var r1 = await sb.from('tasks').select('*').order('id');
    var r2 = await sb.from('team_members').select('*').order('id');
    var r3 = await sb.from('campaign_settings').select('*');

    if (r1.error || r2.error || r3.error) {
      setSaveStatus('error');
      console.error(r1.error, r2.error, r3.error);
      return;
    }

    tasks = r1.data || [];
    var orderRow = (r3.data || []).find(function (x) { return x.key === 'taskOrder'; });
    if (orderRow) { try { taskOrder = JSON.parse(orderRow.value) || []; } catch (e) { taskOrder = []; } }
    var tagRow = (r3.data || []).find(function (x) { return x.key === 'taskTags'; });
    if (tagRow) { try { taskTags = JSON.parse(tagRow.value) || {}; } catch (e) { taskTags = {}; } }
    var asgRow = (r3.data || []).find(function (x) { return x.key === 'taskAssignees'; });
    if (asgRow) { try { taskAssignees = JSON.parse(asgRow.value) || {}; } catch (e) { taskAssignees = {}; } }
    var defRow = (r3.data || []).find(function (x) { return x.key === 'taskTagDefs'; });
    if (defRow) {
      try {
        var parsed = JSON.parse(defRow.value);
        if (Array.isArray(parsed) && parsed.length) TAGS = parsed;
      } catch (e) { /* keep the defaults */ }
    }
    applyTaskOrder();
    team = (r2.data || []).map(function(m) { return m.name; });
    var settings = r3.data || [];
    var nameRow = settings.find(function(s) { return s.key === 'campaignName'; });
    campaignName = nameRow ? nameRow.value : 'Campaign';

    setSaveStatus('saved');
    renderAll();
  }

  async function addTaskAfter(idx) {
    var id = Date.now();
    var newTask = { id: id, name: '', done: false, due: '', assignee: '', priority: 'med' };
    tasks.splice(idx + 1, 0, newTask);
    renderTasks();
    updateCount();
    var input = document.querySelector('.task-name-input[data-id="' + id + '"]');
    if (input) input.focus();
    if (sb) {
      setSaveStatus('saving');
      try { await sb.from('tasks').insert(newTask); setSaveStatus('saved'); }
      catch (e) { setSaveStatus('error'); }
    }
  }

    try { await sb.from('tasks').update(fields).eq('id', id); setSaveStatus('saved'); }
    catch (e) { setSaveStatus('error'); }
  }

    renderTasks();
    updateCount();
    setSaveStatus('saving');

    team.push(name);
    renderTeam();

  function filteredTasks() {
    // Done is its own view. Every other tab shows outstanding work only, which
    // is what makes checking a task move it out of the tab you are looking at.
    var out = tasks.filter(function (t) {
      if (currentFilter === 'done') return t.done;
      if (t.done) return false;
      if (currentFilter === 'all') return true;
      return tagsFor(t.id).indexOf(currentFilter) >= 0;
    });
    // High priority floats up without leaving the list; manual drag order is
    // preserved inside each band.
    var rank = { high: 0, med: 1, low: 2 };
    return out.sort(function (a, b) {
      return (rank[a.priority] == null ? 1 : rank[a.priority]) -
             (rank[b.priority] == null ? 1 : rank[b.priority]);
    });
  }

  // Tag keys come from the fixed TAGS list, never from user input. Labels are
  // escaped anyway.
  function tagChips(id) {
    var ts = tagsFor(id);
    if (!ts.length) return '<span class="tag-empty">+ tag</span>';
    return ts.map(function (k) {
      var d = tagDef(k);
      return d ? '<span class="tag-chip" style="--tc:' + escHtml(d.color) + '">' +
                 escHtml(d.label) + '</span>' : '';
    }).join('');
  }

  function assigneeAvatars(id) {
    var names = assigneesFor(id);
    if (!names.length) return '<span class="assignee-empty">+ assign</span>';
    var shown = names.slice(0, 3);
    var html = shown.map(function (n) {
      return '<span class="assignee-av" title="' + escHtml(n) + '">' + escHtml(getInitials(n)) + '</span>';
    }).join('');
    if (names.length > 3) html += '<span class="assignee-more">+' + (names.length - 3) + '</span>';
    return html;
  }

  function renderTasks() {
    // One-time migration: a task carrying the old single assignee and nothing
    // in the map gets seeded, so existing assignments survive this change.
    var seeded = false;
    tasks.forEach(function (t) {
      var k = String(t.id);
      if (!taskAssignees[k] && t.assignee) { taskAssignees[k] = [t.assignee]; seeded = true; }
    });
    if (seeded) saveAssignees();

    var container = document.getElementById('taskList');
    var visible = filteredTasks();

    container.innerHTML = visible.map(function(t) {
      var overdue = !t.done && isOverdue(t.due);
      return '<div class="task-row' + (t.done ? ' done' : '') + '" data-id="' + t.id + '" draggable="true">' +
        '<div class="task-grip" title="Drag to reorder">&#8942;&#8942;</div>' +
        '<div class="task-check' + (t.done ? ' checked' : '') + '" data-id="' + t.id + '"></div>' +
        '<input class="task-name-input" value="' + escHtml(t.name) + '" placeholder="Task name" data-id="' + t.id + '">' +
        '<div class="tag-cell" data-id="' + t.id + '" title="Click to tag">' + tagChips(t.id) + '</div>' +
        '<div class="due-wrap">' +
          '<input class="task-due' + (overdue ? ' overdue' : '') + (t.due ? '' : ' no-date') +
            '" type="date" value="' + (t.due || '') + '" data-id="' + t.id + '">' +
          (t.due ? '' : '<span class="due-dash">&mdash;</span>') +
        '</div>' +
        '<div class="assignee-cell" data-id="' + t.id + '" title="Click to assign">' + assigneeAvatars(t.id) + '</div>' +
        '<button class="task-priority-btn" data-id="' + t.id + '" data-priority="' + t.priority + '">' +
          '<span class="dot"></span>' + PRIORITY_LABELS[t.priority] + '</button>' +
        '<button class="task-delete" data-id="' + t.id + '">&times;</button>' +
      '</div>';
    }).join('');

    // Drag to reorder. Only meaningful in the unfiltered view, since a
    // filtered list shows a subset and dropping into it cannot express a
    // position among the hidden rows.
    container.querySelectorAll('.assignee-cell').forEach(function (cell) {
      cell.addEventListener('click', function (e) {
        e.stopPropagation();
        openAssignPop(cell, parseInt(cell.dataset.id));
      });
    });

    container.querySelectorAll('.tag-cell').forEach(function (cell) {
      cell.addEventListener('click', function (e) {
        e.stopPropagation();
        openTagPop(cell, parseInt(cell.dataset.id));
      });
    });

    var dragId = null;
    container.querySelectorAll('.task-row').forEach(function (row) {
      row.addEventListener('dragstart', function (e) {
        // Allowed under a filter: a task can be dragged onto a tag tab, and
        // reordering stays correct because the drop handler splices into the
        // FULL order adjacent to the target.
        dragId = parseInt(row.dataset.id);
        tagDragId = dragId;
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', String(dragId)); } catch (err) {}
      });
      row.addEventListener('dragend', function () {
        dragId = null; tagDragId = null;
        container.querySelectorAll('.task-row').forEach(function (r) {
          r.classList.remove('dragging', 'drop-above', 'drop-below');
        });
      });
      row.addEventListener('dragover', function (e) {
        if (dragId === null || parseInt(row.dataset.id) === dragId) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        var mid = row.getBoundingClientRect().top + row.offsetHeight / 2;
        row.classList.toggle('drop-above', e.clientY < mid);
        row.classList.toggle('drop-below', e.clientY >= mid);
      });
      row.addEventListener('dragleave', function () {
        row.classList.remove('drop-above', 'drop-below');
      });
      row.addEventListener('drop', function (e) {
        e.preventDefault();
        var targetId = parseInt(row.dataset.id);
        if (dragId === null || targetId === dragId) return;
        var below = row.classList.contains('drop-below');
        var from = tasks.findIndex(function (t) { return t.id === dragId; });
        if (from < 0) return;
        var moved = tasks.splice(from, 1)[0];
        var to = tasks.findIndex(function (t) { return t.id === targetId; });
        tasks.splice(below ? to + 1 : to, 0, moved);
        renderTasks();
        saveTaskOrder();
      });
    });

    // Wire events
    container.querySelectorAll('.task-check').forEach(function(el) {
      el.addEventListener('click', function() {
        var task = tasks.find(function(t) { return t.id === parseInt(el.dataset.id); });
        if (task) { task.done = !task.done; renderTasks(); buildFilterBar(); updateCount(); updateTask(task.id, { done: task.done }); }
      });
    });

    var nameTimers = {};
    container.querySelectorAll('.task-name-input').forEach(function(el) {
      el.addEventListener('input', function() {
        var id = parseInt(el.dataset.id);
        var task = tasks.find(function(t) { return t.id === id; });
        if (task) {
          task.name = el.value;
          clearTimeout(nameTimers[id]);
          nameTimers[id] = setTimeout(function() { updateTask(id, { name: task.name }); }, 400);
        }
      });
    });

    container.querySelectorAll('.task-due').forEach(function(el) {
      el.addEventListener('change', function() {
        var task = tasks.find(function(t) { return t.id === parseInt(el.dataset.id); });
        if (task) { task.due = el.value; renderTasks(); updateTask(task.id, { due: task.due }); }
      });
    });

    container.querySelectorAll('.task-priority-btn').forEach(function(el) {
      el.addEventListener('click', function() {
        var task = tasks.find(function(t) { return t.id === parseInt(el.dataset.id); });
        if (task) {
          var idx = PRIORITIES.indexOf(task.priority);
          task.priority = PRIORITIES[(idx + 1) % PRIORITIES.length];
          renderTasks();
          updateTask(task.id, { priority: task.priority });
        }
      });
    });

    container.querySelectorAll('.task-delete').forEach(function(el) {
      el.addEventListener('click', function() { deleteTask(parseInt(el.dataset.id)); });
    });

    container.querySelectorAll('.task-name-input').forEach(function(el) {
      el.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          var currentId = parseInt(el.dataset.id);
          var idx = tasks.findIndex(function(t) { return t.id === currentId; });
          addTaskAfter(idx);
        }
      });
    });
  }

  function updateCount() {
    var active = tasks.filter(function(t) { return !t.done; }).length;
    document.getElementById('taskCount').textContent = active + ' active / ' + tasks.length + ' total';
  }

  // --- Event listeners ---

  document.getElementById('teamToggle').addEventListener('click', function() {
    var panel = document.getElementById('teamPanel');
    var arrow = document.getElementById('teamArrow');
    var isOpen = panel.classList.toggle('open');
    arrow.classList.toggle('open', isOpen);
  });

  function handleAddMember() {
    var input = document.getElementById('addMemberInput');
    var name = input.value.trim();
    input.value = '';
    addTeamMember(name);
  }
  document.getElementById('addMemberBtn').addEventListener('click', handleAddMember);
  document.getElementById('addMemberInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleAddMember();
  });

  document.getElementById('addTaskBtn').addEventListener('click', addTask);

  document.querySelectorAll('.filter-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderTasks();
    });
  });

  document.getElementById('campaignName').addEventListener('input', function(e) {
    campaignName = e.target.value;
    clearTimeout(nameTimeout);
    nameTimeout = setTimeout(function() { saveCampaignName(campaignName); }, 500);
  });

  // --- Init ---

  // --- Auth gate ---
  var AUTH_EMAIL = 'questionnaire@dariaforberkeley.com';
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function showApp() {
    document.getElementById('authGate').style.display = 'none';
    document.getElementById('siteNav').style.display = '';
    document.getElementById('app').style.display = '';
    if (!isConfigured()) {
      document.getElementById('setupBanner').innerHTML =
        '<div class="setup-banner">' +
          '<strong>Supabase not configured.</strong> Paste your project URL and anon key into ' +
          '<code>index.html</code> and run <code>setup.sql</code> in the SQL Editor.' +
        '</div>';
      setSaveStatus('error');
      renderAll();
    } else {
      loadAll().then(subscribeRealtime);
    }
  }

  async function doAuth() {
    var pass = document.getElementById('authPass').value.trim();
    if (!pass) { document.getElementById('authError').textContent = 'Enter the passphrase.'; document.getElementById('authError').style.display = 'block'; return; }
    document.getElementById('authBtn').disabled = true;
    document.getElementById('authBtn').textContent = 'Signing in...';
    try {
      var res = await sb.auth.signInWithPassword({ email: AUTH_EMAIL, password: pass });
      if (res.error) throw res.error;
      showApp();
    } catch (e) {
      document.getElementById('authBtn').disabled = false;
      document.getElementById('authBtn').textContent = 'Sign in';
      document.getElementById('authError').textContent = 'Wrong passphrase.';
      document.getElementById('authError').style.display = 'block';
    }
  }
  document.getElementById('authBtn').addEventListener('click', doAuth);
  document.getElementById('authPass').addEventListener('keydown', function (e) { if (e.key === 'Enter') doAuth(); });

  sb.auth.getSession().then(function (r) {
    if (r.data && r.data.session) showApp();
  });
</script>
</body>
