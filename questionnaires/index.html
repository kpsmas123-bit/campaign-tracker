<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Questionnaires</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #F9F9F6;
    --surface: #FFFFFF;
    --text: #2A2A2E;
    --text-secondary: #7C7C82;
    --text-tertiary: #A8A8AC;
    --border: #E6E6E2;
    --border-light: #F0F0EC;
    --accent: #4A6FA5;
    --accent-hover: #3D5E8C;
    --priority-high: #C45240;
    --priority-high-bg: #C4524012;
    --priority-medium: #C89B2A;
    --priority-medium-bg: #C89B2A12;
    --priority-low: #6B956B;
    --priority-low-bg: #6B956B12;
    --hover: #F4F4F0;
    --team-bg: #F2F2EE;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #18181B;
      --surface: #1E1E22;
      --text: #E4E4E0;
      --text-secondary: #8E8E92;
      --text-tertiary: #5A5A5E;
      --border: #2E2E32;
      --border-light: #262628;
      --accent: #6B8FC4;
      --accent-hover: #7DA0D0;
      --priority-high: #D4705F;
      --priority-high-bg: #D4705F18;
      --priority-medium: #D4AD4A;
      --priority-medium-bg: #D4AD4A18;
      --priority-low: #7DAF7D;
      --priority-low-bg: #7DAF7D18;
      --hover: #24242A;
      --team-bg: #222226;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--ground);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

  .site-nav {
    display: flex; align-items: center; gap: 2px;
    max-width: 860px; margin: 0 auto;
    padding: 16px 24px 0;
  }
  .site-nav a {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-tertiary); text-decoration: none;
    padding: 5px 10px; border-bottom: 2px solid transparent;
  }
  .site-nav a:hover { color: var(--text-secondary); }
  .site-nav a.active { color: var(--text); border-bottom-color: var(--accent); }

  .app { max-width: 860px; margin: 0 auto; padding: 32px 24px 80px; }

  /* --- Auth gate --- */
  .auth-gate {
    min-height: calc(100vh - 52px); display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .auth-card { max-width: 340px; width: 100%; display: flex; flex-direction: column; gap: 14px; }
  .auth-title { font-family: Georgia, 'Times New Roman', serif; font-size: 20px; font-weight: normal; }
  .auth-sub { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
  .auth-input {
    font-family: inherit; font-size: 14px; color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 3px; padding: 10px 12px; width: 100%; outline: none;
  }
  .auth-input:focus { border-color: var(--accent); }
  .auth-btn {
    font-family: inherit; font-size: 13px; font-weight: 500;
    color: var(--surface); background: var(--accent);
    border: 1px solid var(--accent); border-radius: 3px;
    padding: 10px 16px; cursor: pointer; width: 100%;
  }
  .auth-btn:hover { background: var(--accent-hover); }
  .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .auth-error { font-size: 13px; color: var(--priority-high); line-height: 1.5; }

  /* --- Header --- */
  .header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 14px; flex-wrap: wrap;
    margin-bottom: 20px; padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .title {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 22px; font-weight: normal;
  }
  .header-right { display: flex; gap: 8px; align-items: center; }
  .back-link {
    font-family: "IBM Plex Mono", monospace; font-size: 12px;
    color: var(--text-secondary); text-decoration: none;
    border: 1px solid var(--border); border-radius: 3px; padding: 7px 12px;
  }
  .back-link:hover { border-color: var(--accent); color: var(--accent); }

  /* --- Filter row --- */
  .filters {
    display: flex; gap: 14px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .fbtn {
    font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 500;
    letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--text-tertiary); background: none;
    border: none; padding: 5px 2px 6px; cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color .12s, border-color .12s;
  }
  .fbtn:hover { color: var(--text-secondary); }
  .fbtn.active {
    color: var(--text); font-weight: 600;
    border-bottom-color: var(--accent);
  }
  /* The count stays quiet even on the active tab, so the number does not
     compete with the label it belongs to. */
  .fbtn .filter-count { font-weight: 400; }

  /* --- Table --- */
  .table { width: 100%; }
  .thead {
    display: grid;
    grid-template-columns: 1fr 100px 110px 1fr;
    gap: 8px; padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  .th {
    font-family: "IBM Plex Mono", monospace; font-size: 10px;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-tertiary); font-weight: 600;
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 100px 110px 1fr;
    gap: 8px; padding: 10px 12px; align-items: center;
    border-bottom: 1px solid var(--border-light);
  }
  .row:hover { background: var(--hover); }
  .row[draggable="true"] { cursor: grab; }
  .row.dragging { opacity: 0.4; cursor: grabbing; }
  .row.drop-above { box-shadow: inset 0 2px 0 0 var(--accent); }
  .row.drop-below { box-shadow: inset 0 -2px 0 0 var(--accent); }

  .org-link { text-decoration: none; color: inherit; cursor: pointer; }
  .org-link:hover .org-name { color: var(--accent); }
  .org-name { font-size: 14px; font-weight: 500; transition: color 0.1s; }
  .org-sub {
    font-family: "IBM Plex Mono", monospace; font-size: 11px;
    color: var(--text-tertiary); margin-top: 1px;
  }

  .cell {
    font-family: "IBM Plex Mono", monospace; font-size: 11px;
    color: var(--text-secondary);
  }
  .cell-edit {
    font-family: "IBM Plex Mono", monospace; font-size: 11px;
    color: var(--text-secondary);
    outline: none; cursor: text; white-space: pre-wrap; min-height: 1.4em;
    padding: 2px 4px; border-radius: 2px; transition: background 0.15s;
  }
  .cell-edit:hover { background: var(--hover); }
  .cell-edit:focus { background: var(--hover); }
  .cell-edit:empty::before {
    content: attr(data-placeholder);
    color: var(--text-tertiary); pointer-events: none;
  }

  .prog-wrap {
    display: flex; align-items: center; gap: 8px;
  }
  .prog-bar {
    height: 6px; background: var(--border); border-radius: 3px;
    overflow: hidden; flex: 1; min-width: 50px;
  }
  .prog-bar .fill { height: 100%; border-radius: 3px; transition: width 0.3s ease; }
  .prog-bar .fill.red { background: var(--priority-high); }
  .prog-bar .fill.amber { background: var(--priority-medium); }
  .prog-bar .fill.green { background: var(--priority-low); }
  .prog-pct {
    font-family: "IBM Plex Mono", monospace; font-size: 12px;
    font-weight: 600; min-width: 32px; text-align: right;
  }
  .prog-pct.red { color: var(--priority-high); }
  .prog-pct.amber { color: var(--priority-medium); }
  .prog-pct.green { color: var(--priority-low); }

  .empty {
    padding: 40px 16px; text-align: center;
    color: var(--text-tertiary); font-size: 13px;
  }

  /* --- Group membership --- */
  /* The filter chips are the drop targets: drag a row up onto Priority or Done
     to move it. Keeping the list flat means one drag gesture does one thing. */
  .fbtn.drop-target {
    color: #FFF; background: var(--accent);
    border-radius: 3px; border-bottom-color: transparent;
  }
  .org-cell { display: flex; align-items: flex-start; gap: 7px; min-width: 0; }
  .org-cell .org-link { min-width: 0; }
  .pri-toggle {
    flex-shrink: 0; margin-top: 3px;
    width: 11px; height: 11px; padding: 0; border-radius: 50%;
    border: 1.5px solid var(--border); background: none; cursor: pointer;
  }
  .pri-toggle:hover { border-color: var(--priority-high); }
  .pri-toggle.on { background: var(--priority-high); border-color: var(--priority-high); }

  .row.finished { opacity: .62; }
  .row.finished:hover { opacity: 1; }
  .row.finished .org-name { color: var(--text-secondary); }
  .done-mark { color: var(--priority-low); margin-right: 5px; }
  .pri-mark { color: var(--priority-high); margin-right: 5px; }

  @media (max-width: 640px) {
    .thead, .row { grid-template-columns: 1fr 80px; }
    .thead .th:nth-child(3), .row > *:nth-child(3),
    .thead .th:nth-child(4), .row > *:nth-child(4) { display: none; }
  }
</style>
</head>
<body>

<nav class="site-nav" id="siteNav">
  <a href="../index.html">Tasks</a>
  <a href="index.html" class="active">Questionnaires</a>
  <a href="../donors/index.html">Fundraising</a>
  <a href="../calendar/index.html">Calendar</a>
  <a href="../calltime/index.html">Call Time</a>
</nav>

<div class="auth-gate" id="authGate">
  <div class="auth-card">
    <div class="auth-title">Daria for Berkeley</div>
    <div class="auth-sub">Enter the campaign passphrase to continue.</div>
    <input class="auth-input" id="authPass" type="password" placeholder="Passphrase" autocomplete="current-password">
    <button class="auth-btn" id="authBtn">Sign in</button>
    <div class="auth-error" id="authError" style="display:none"></div>
  </div>
</div>

<div class="app" id="appRoot" style="display:none">
  <div class="header">
    <div class="title">Endorsement questionnaires</div>
  </div>

  <div class="filters" id="filters"></div>

  <div class="table">
    <div class="thead">
      <div class="th">Organization</div>
      <div class="th">Complete</div>
      <div class="th">Due</div>
      <div class="th">Notes</div>
    </div>
    <div id="rows"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var SUPABASE_URL = 'https://qhrtqtnrduambvchjxqw.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_UAG7Ru6PRdNnOLCbchpQVg_8vE0jG5N';
  var AUTH_EMAIL = 'questionnaire@dariaforberkeley.com';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var KNOWN_ORGS = ['nuhw', 'alc', 'btu', 'uaw', 'phdc', 'pp', 'cbd', 'wfp', 'eb4e', 'seiu', 'bside', 'oreb', 'oe3', 'ebsd', 'apa', 'ebap', 'bridge', 'afscme', 'lcv', 'green', '350ba', 'acdp', 'bayrising', 'bwopa', 'bcce', 'ebyimby'];
  var orgData = {};
  var statusData = {};
  var answerCounts = {};
  var dueDates = {};
  // No "All" tab: the list is always one group, and a row moves between groups
  // by being dragged onto another tab. Defaults to In progress, which is where
  // anything with no status set lands.
  var activeFilter = (function () {
    try {
      var v = localStorage.getItem('qFilter');
      if (v) return v;
    } catch (e) {}
    return 'active';
  })();
  // Module scope: the filter chips are drop targets, and they are built in a
  // different function from the rows being dragged.
  var dragSlug = null;
  // Manual org order, persisted as a list of slugs in campaign_settings —
  // additive, so no schema change to the questionnaire tables.
  var orgOrder = [];

  function orderedSlugs(list) {
    if (!orgOrder.length) return list;
    var pos = {};
    orgOrder.forEach(function (s, i) { pos[s] = i; });
    return list.slice().sort(function (a, b) {
      var pa = pos[a], pb = pos[b];
      if (pa === undefined && pb === undefined) return 0;
      if (pa === undefined) return 1;   // orgs added since the last reorder go last
      if (pb === undefined) return -1;
      return pa - pb;
    });
  }

  async function saveOrgOrder(newOrder) {
    orgOrder = newOrder;
    await sb.from('campaign_settings')
      .upsert({ key: 'questionnaireOrder', value: JSON.stringify(orgOrder) });
  }

  var authGate = document.getElementById('authGate');
  var authPass = document.getElementById('authPass');
  var authBtn = document.getElementById('authBtn');
  var authError = document.getElementById('authError');
  var appRoot = document.getElementById('appRoot');

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // --- Auth ---
  async function doAuth() {
    var pass = authPass.value.trim();
    if (!pass) { showErr('Enter the passphrase.'); return; }
    authBtn.disabled = true; authBtn.textContent = 'Signing in...';
    try {
      var res = await sb.auth.signInWithPassword({ email: AUTH_EMAIL, password: pass });
      if (res.error) throw res.error;
      authGate.style.display = 'none'; document.getElementById('siteNav').style.display = ''; appRoot.style.display = 'block'; boot();
    } catch (e) {
      authBtn.disabled = false; authBtn.textContent = 'Sign in'; showErr('Wrong passphrase.');
    }
  }
  function showErr(m) { authError.textContent = m; authError.style.display = 'block'; }
  authBtn.addEventListener('click', doAuth);
  authPass.addEventListener('keydown', function (e) { if (e.key === 'Enter') doAuth(); });
  // The Cloudflare edge gate hands us the Supabase login once its passcode has
  // been accepted, so the team types one code rather than two. Falls back to the
  // passphrase box whenever that endpoint is absent — local files, GitHub Pages,
  // or any host without the middleware.
  async function edgeSignIn(reveal) {
    try {
      var r = await fetch('/__hq/session', { cache: 'no-store', credentials: 'same-origin' });
      if (!r.ok) return false;
      var j = await r.json();
      if (!j || !j.password) return false;
      var a = await sb.auth.signInWithPassword({ email: j.email, password: j.password });
      if (a.error) return false;
      reveal();
      return true;
    } catch (e) { return false; }
  }

  function revealApp() {
    authGate.style.display = 'none';
    document.getElementById('siteNav').style.display = '';
    appRoot.style.display = 'block';
    boot();
  }
  sb.auth.getSession().then(async function (r) {
    if (r.data && r.data.session) { revealApp(); return; }
    await edgeSignIn(revealApp);
  });

  // --- Boot ---
  async function boot() {
    var loads = KNOWN_ORGS.map(function (slug) {
      return fetch('data/' + slug + '.json').then(function (r) { return r.json(); }).then(function (d) {
        orgData[slug] = d;
      }).catch(function () {});
    });
    await Promise.all(loads);

    try {
      var r = await sb.from('questionnaire_status').select('*');
      if (r.data) r.data.forEach(function (s) { statusData[s.org_slug] = s; });
    } catch (e) {}

    try {
      var dd = await fetch('data/due_dates.json').then(function (r) { return r.json(); });
      dueDates = dd || {};
    } catch (e) {}

    try {
      var r2 = await sb.from('questionnaire_answers')
        .select('org_slug,question_id,answer_text,approved');
      if (r2.data) {
        // Rows are namespaced: "__a__<qid>" holds an analysis override and
        // "__c__<qid>" holds checkbox selections. Counting rows directly
        // double-counts a question answered both ways, and treats an analysis
        // note as an answer. Track distinct question ids instead.
        var seen = {}, seenAppr = {};
        r2.data.forEach(function (row) {
          var org = row.org_slug, qid = row.question_id, filled = false;
          if (qid.indexOf('__a__') === 0) return;              // analysis, not an answer
          if (qid.indexOf('__c__') === 0) {
            qid = qid.slice(5);
            filled = !!(row.answer_text && row.answer_text.trim());  // a ticked box counts
          } else {
            filled = !!(row.answer_text && row.answer_text.trim());
          }
          if (!answerCounts[org]) answerCounts[org] = { answered: 0, approved: 0, total: 0 };
          if (!seen[org]) { seen[org] = {}; seenAppr[org] = {}; }
          if (filled && !seen[org][qid]) { seen[org][qid] = 1; answerCounts[org].answered++; }
          if (row.approved && !seenAppr[org][qid]) { seenAppr[org][qid] = 1; answerCounts[org].approved++; }
        });
      }
    } catch (e) {}

    KNOWN_ORGS.forEach(function (slug) {
      if (orgData[slug] && !answerCounts[slug]) {
        answerCounts[slug] = { answered: 0, approved: 0, total: orgData[slug].questions.length };
      }
      if (answerCounts[slug] && orgData[slug]) {
        answerCounts[slug].total = orgData[slug].questions.length;
      }
    });

    try {
      var ro = await sb.from('campaign_settings').select('value').eq('key', 'questionnaireOrder');
      if (ro.data && ro.data.length) orgOrder = JSON.parse(ro.data[0].value) || [];
    } catch (e) { orgOrder = []; }

    buildFilters();
    render();
  }

  // --- Grouping ---
  // Three manual groups, stored in questionnaire_status.status, a column that
  // existed in the schema but was unused by the UI. Set by dragging a row
  // across a divider rather than computed from percent complete: a
  // questionnaire can be submitted with questions deliberately left blank, and
  // one sitting at 100% may still be unsent.
  // Two groups, not three. Priority is a flag inside In progress rather than a
  // separate list — a priority questionnaire is still in progress, and splitting
  // them meant looking in two places for outstanding work.
  var GROUPS = [
    { key: 'active',   label: 'In progress' },
    { key: 'finished', label: 'Done' }
  ];
  function isGroupKey(k) {
    return GROUPS.some(function (g) { return g.key === k; });
  }
  function groupOf(slug) {
    var s = statusData[slug];
    // 'priority' is stored in the same column but is not a group; it sorts
    // within In progress. Anything unset or legacy lands in In progress too.
    return (s && s.status === 'finished') ? 'finished' : 'active';
  }
  function isPriority(slug) {
    var s = statusData[slug];
    return !!(s && s.status === 'priority');
  }
  function togglePriority(slug) {
    return saveField(slug, 'status', isPriority(slug) ? 'active' : 'priority')
      .then(function () { buildFilters(); render(); });
  }
  function setGroup(slug, key) {
    return saveField(slug, 'status', key).then(function () { buildFilters(); render(); });
  }

  // --- Filters ---
  function buildFilters() {
    var wrap = document.getElementById('filters');
    // A remembered tab can outlive the thing it pointed at — a removed category,
    // or the old 'all' value. Fall back rather than render an empty page.
    if (!isGroupKey(activeFilter) &&
        !Object.values(statusData).some(function (s) { return s.category === activeFilter; })) {
      activeFilter = 'active';
    }
    wrap.innerHTML = '';
    var opts = [];
    GROUPS.forEach(function (g) {
      opts.push({
        k: g.key, label: g.label,
        n: KNOWN_ORGS.filter(function (s) { return groupOf(s) === g.key; }).length
      });
    });
    // Category chips, minus any that would duplicate a group chip. A category
    // literally named "Priority" is likely, and two identical-looking filters
    // that do different things is worse than dropping one.
    Object.values(statusData).forEach(function (s) {
      if (!s.category) return;
      var dup = opts.some(function (o) {
        return o.k.toLowerCase() === s.category.toLowerCase() ||
               o.label.toLowerCase() === s.category.toLowerCase();
      });
      if (!dup) opts.push({ k: s.category, label: s.category });
    });
    opts.forEach(function (o) {
      var b = document.createElement('button');
      b.className = 'fbtn' + (o.k === activeFilter ? ' active' : '');
      b.textContent = o.label + (o.n != null ? ' ' + o.n : '');
      b.addEventListener('click', function () {
        activeFilter = o.k;
        try { localStorage.setItem('qFilter', o.k); } catch (e) {}
        buildFilters(); render();
      });

      // Group chips double as drop targets: drag a row up onto "Priority" or
      // "Done" to move it there. Category chips are not targets, since a
      // category is a different axis from group membership.
      if (isGroupKey(o.k)) {
        b.addEventListener('dragover', function (e) {
          if (!dragSlug || groupOf(dragSlug) === o.k) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          b.classList.add('drop-target');
        });
        b.addEventListener('dragleave', function () { b.classList.remove('drop-target'); });
        b.addEventListener('drop', function (e) {
          e.preventDefault();
          b.classList.remove('drop-target');
          if (!dragSlug || groupOf(dragSlug) === o.k) return;
          setGroup(dragSlug, o.k);
        });
      }
      wrap.appendChild(b);
    });
  }

  // --- Inline edit helpers ---
  function debounce(fn, ms) {
    var t; return function () { clearTimeout(t); t = setTimeout(fn, ms); };
  }
  async function saveField(slug, field, value) {
    var row = { org_slug: slug };
    row[field] = value || null;
    await sb.from('questionnaire_status').upsert(row, { onConflict: 'org_slug' });
    if (!statusData[slug]) statusData[slug] = { org_slug: slug };
    statusData[slug][field] = value || null;
  }

  // --- Render ---
  function render() {
    var wrap = document.getElementById('rows');
    wrap.innerHTML = '';
    var slugs = orderedSlugs(KNOWN_ORGS).filter(function (slug) {
      if (isGroupKey(activeFilter)) return groupOf(slug) === activeFilter;
      var s = statusData[slug];
      return s && s.category === activeFilter;
    });

    if (!slugs.length) {
      wrap.innerHTML = '<div class="empty">No questionnaires match this filter.</div>';
      return;
    }

    // Priority floats to the top without leaving the list. Manual drag order is
    // preserved within each band, so reordering still behaves.
    slugs.sort(function (a, b) {
      var pa = isPriority(a) ? 0 : 1, pb = isPriority(b) ? 0 : 1;
      return pa - pb;
    });

    function makeRow(slug) {
      var d = orgData[slug];
      var st = statusData[slug] || {};
      var ac = answerCounts[slug] || { answered: 0, approved: 0, total: 0 };
      if (!d) return;

      var row = document.createElement('div');
      row.className = 'row' + (groupOf(slug) === 'finished' ? ' finished' : '');
      row.draggable = true;
      row.dataset.slug = slug;

      // Dragging is always allowed now that there is no unfiltered view: a row
      // is dragged either onto another tab to change group, or onto a sibling
      // row to reorder. Reordering stays correct under a filter because the
      // drop handler splices into the FULL ordered list adjacent to the target,
      // so hidden rows keep their relative positions.
      row.addEventListener('dragstart', function (e) {
        dragSlug = slug;
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', slug); } catch (err) {}
      });
      row.addEventListener('dragend', function () {
        dragSlug = null;
        wrap.querySelectorAll('.row').forEach(function (r) {
          r.classList.remove('dragging', 'drop-above', 'drop-below');
        });
      });
      row.addEventListener('dragover', function (e) {
        if (!dragSlug || slug === dragSlug) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        var mid = row.getBoundingClientRect().top + row.offsetHeight / 2;
        row.classList.toggle('drop-above', e.clientY < mid);
        row.classList.toggle('drop-below', e.clientY >= mid);
      });
      row.addEventListener('dragleave', function () {
        row.classList.remove('drop-above', 'drop-below');
      });
      row.addEventListener('drop', function (e) {
        e.preventDefault();
        if (!dragSlug || slug === dragSlug) return;
        // Dropping onto a row in the other group moves the questionnaire into
        // that group. Same group is a plain reorder, as before.
        if (groupOf(slug) !== groupOf(dragSlug)) {
          setGroup(dragSlug, groupOf(slug));
          return;
        }
        var below = row.classList.contains('drop-below');
        var next = orderedSlugs(KNOWN_ORGS).filter(function (x) { return x !== dragSlug; });
        var at = next.indexOf(slug);
        next.splice(below ? at + 1 : at, 0, dragSlug);
        saveOrgOrder(next).then(render);
      });

      // Org name cell — priority toggle plus clickable link
      var c1 = document.createElement('div');
      c1.className = 'org-cell';
      var link = document.createElement('a');
      link.className = 'org-link';
      link.href = 'questionnaire.html?org=' + slug;
      link.innerHTML = '<div class="org-name">' +
        (groupOf(slug) === 'finished' ? '<span class="done-mark">&#10003;</span>' : '') +
        esc(d.org) + '</div>' +
        '<div class="org-sub">' + esc(d.cycle) + ' · ' + esc(d.candidate) + '</div>';

      // Priority toggle. Sits outside the link so clicking it does not navigate.
      if (groupOf(slug) !== 'finished') {
        var star = document.createElement('button');
        star.className = 'pri-toggle' + (isPriority(slug) ? ' on' : '');
        star.title = isPriority(slug) ? 'Remove priority' : 'Mark priority';
        star.setAttribute('aria-pressed', isPriority(slug) ? 'true' : 'false');
        star.addEventListener('click', function (e) {
          e.preventDefault(); e.stopPropagation();
          togglePriority(slug);
        });
        c1.appendChild(star);
      }
      c1.appendChild(link);

      // % complete
      var pct = ac.total ? Math.round((ac.approved + (ac.answered - ac.approved) * 0.5) / ac.total * 100) : 0;
      var color = pct >= 75 ? 'green' : pct >= 35 ? 'amber' : 'red';
      var c2 = document.createElement('div');
      c2.className = 'prog-wrap';
      c2.innerHTML = '<span class="prog-bar"><span class="fill ' + color + '" style="width:' + pct + '%"></span></span>' +
        '<span class="prog-pct ' + color + '">' + pct + '%</span>';

      // Due date — inline editable
      var dueVal = (st.timing || dueDates[slug] || '').trim();
      var cDue = document.createElement('div');
      cDue.className = 'cell-edit';
      cDue.contentEditable = 'true';
      cDue.setAttribute('data-placeholder', '—');
      cDue.setAttribute('data-slug', slug);
      cDue.setAttribute('data-field', 'timing');
      cDue.textContent = dueVal;
      cDue.addEventListener('input', debounce(function () { saveField(slug, 'timing', cDue.textContent.trim()); }, 800));

      // Notes — inline editable
      var notesVal = (st.notes || '').trim();
      var cNotes = document.createElement('div');
      cNotes.className = 'cell-edit';
      cNotes.contentEditable = 'true';
      cNotes.setAttribute('data-placeholder', '—');
      cNotes.setAttribute('data-slug', slug);
      cNotes.setAttribute('data-field', 'notes');
      cNotes.textContent = notesVal;
      cNotes.addEventListener('input', debounce(function () { saveField(slug, 'notes', cNotes.textContent.trim()); }, 800));

      row.appendChild(c1);
      row.appendChild(c2);
      row.appendChild(cDue);
      row.appendChild(cNotes);
      wrap.appendChild(row);
    }

    slugs.forEach(makeRow);
  }
})();
</script>
</body>
</html>
