<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<!-- GitHub Pages cannot set response headers, so the policy rides in a meta
     tag. connect-src is the load-bearing directive: this page handles contact
     PII, and even if markup were injected it cannot phone data to another host. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src https://fonts.gstatic.com;
  connect-src 'self' https://qhrtqtnrduambvchjxqw.supabase.co wss://qhrtqtnrduambvchjxqw.supabase.co;
  img-src 'self' data:;
  object-src 'none';
  base-uri 'none';
  form-action 'none'">
<title>Call Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #F9F9F6; --surface: #FFFFFF;
    --text: #2A2A2E; --text-secondary: #7C7C82; --text-tertiary: #A8A8AC;
    --border: #E6E6E2; --border-light: #F0F0EC;
    --accent: #4A6FA5; --accent-hover: #3D5E8C;
    --priority-high: #C45240; --priority-high-bg: #C4524012;
    --priority-medium: #C89B2A;
    --priority-low: #6B956B; --priority-low-bg: #6B956B12;
    --team-bg: #F2F2EE; --hover: #F4F4F0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #18181B; --surface: #1E1E22;
      --text: #E4E4E0; --text-secondary: #8E8E92; --text-tertiary: #5A5A5E;
      --border: #2E2E32; --border-light: #262628;
      --accent: #6B8FC4; --accent-hover: #7DA0D0;
      --priority-high: #D4705F; --priority-high-bg: #D4705F18;
      --priority-medium: #D4AD4A;
      --priority-low: #7DAF7D; --priority-low-bg: #7DAF7D18;
      --team-bg: #222226; --hover: #24242A;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--ground); color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }

  .auth-gate { min-height: calc(100vh - 52px); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-card { max-width: 340px; width: 100%; display: flex; flex-direction: column; gap: 14px; }
  .auth-title { font-family: Georgia, 'Times New Roman', serif; font-size: 20px; font-weight: normal; }
  .auth-sub { font-size: 13px; color: var(--text-secondary); }
  .auth-input {
    font-family: inherit; font-size: 14px; color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 3px; padding: 10px 12px; width: 100%; outline: none;
  }
  .auth-input:focus { border-color: var(--accent); }
  .auth-btn {
    font-family: inherit; font-size: 13px; font-weight: 500; color: #FFF;
    background: var(--accent); border: 1px solid var(--accent);
    border-radius: 3px; padding: 10px 16px; cursor: pointer; width: 100%;
  }
  .auth-btn:hover { background: var(--accent-hover); }
  .auth-error { font-size: 13px; color: var(--priority-high); }

  .site-nav { display: flex; align-items: center; gap: 2px; max-width: 1060px; margin: 0 auto; padding: 16px 24px 0; }
  .site-nav a {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-tertiary); text-decoration: none;
    padding: 5px 10px; border-bottom: 2px solid transparent;
  }
  .site-nav a:hover { color: var(--text-secondary); }
  .site-nav a.active { color: var(--text); border-bottom-color: var(--accent); }

  .app { max-width: 1060px; margin: 0 auto; padding: 40px 24px 80px; }

  .header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; margin-bottom: 6px;
  }
  .page-title { font-family: Georgia, 'Times New Roman', serif; font-size: 22px; font-weight: normal; }

  /* Pushed right so the title keeps the left edge and the save indicator stays
     adjacent, rather than the three children spreading across the header. */
  .sync-btn {
    margin-left: auto; font-family: inherit; font-size: 11px;
    color: var(--text-tertiary); background: none;
    border: 1px solid var(--border); border-radius: 4px;
    padding: 3px 8px; cursor: pointer; white-space: nowrap;
    transition: color .12s, border-color .12s;
  }
  .sync-btn:hover { color: var(--text); border-color: var(--text-tertiary); }
  .sync-btn[disabled] { opacity: .5; cursor: default; }

  .save-indicator {
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px;
    color: var(--text-secondary); opacity: 0; transition: opacity .2s;
  }
  .save-indicator.visible { opacity: 1; }
  .save-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-secondary); }
  .save-indicator.saving .save-dot { background: var(--priority-medium); animation: pulse .8s ease-in-out infinite; }
  .save-indicator.saved  .save-dot { background: var(--priority-low); }
  .save-indicator.error  .save-dot { background: var(--priority-high); }
  .save-indicator.error  { color: var(--priority-high); }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.4;transform:scale(.7);} }

  /* --- focus view -------------------------------------------------------
     A sheet over the list rather than a separate page: the filter and position
     behind it stay exactly as they were when the session ends. */
  .focus {
    position: fixed; inset: 0; z-index: 40; overflow-y: auto;
    background: var(--ground); padding: 24px 20px 60px;
  }
  .focus[hidden] { display: none; }
  .focus-card { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .focus-top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .focus-prog {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px;
    letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-secondary);
  }
  .focus-x {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px;
    letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-tertiary);
    background: none; border: none; cursor: pointer; padding: 2px 0;
  }
  .focus-x:hover { color: var(--text); }
  .focus-bar { height: 2px; background: var(--border-light); border-radius: 2px; overflow: hidden; margin-top: -12px; }
  .focus-bar > div { height: 100%; background: var(--priority-low); transition: width .2s; }

  .focus-name { display: flex; align-items: flex-start; gap: 12px; }
  .fname { font-family: Georgia, 'Times New Roman', serif; font-size: 34px; line-height: 1.1; }
  .fpri {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px;
    letter-spacing: 0.06em; border-radius: 2px; padding: 3px 7px; margin-top: 7px;
    border: 1px solid var(--border); color: var(--text-tertiary);
  }
  .fpri.p1 { color: var(--priority-medium); border-color: var(--priority-medium);
             background: color-mix(in srgb, var(--priority-medium) 12%, transparent); }

  /* The dominant target on the screen: this is the thing you press. */
  .focus-tel {
    display: flex; align-items: center; justify-content: center; min-height: 64px;
    border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent);
    border-radius: 4px; text-decoration: none; color: var(--accent);
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 28px; letter-spacing: .02em;
  }
  .focus-tel.none { border-style: dashed; border-color: var(--border); color: var(--text-tertiary); font-size: 15px; }
  .focus-mail { font-size: 13px; color: var(--text-secondary); text-decoration: none; margin-top: -12px; }
  .focus-mail:hover { color: var(--accent); }

  .fblock { display: flex; flex-direction: column; gap: 6px; }
  .flabel {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px;
    letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-secondary);
  }
  .fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .fask, .fside { border-left: 2px solid var(--priority-low); padding: 2px 0 2px 11px; font-size: 14px; }
  .fside { border-left-color: var(--border); color: var(--text-secondary); }
  .fside.on { border-left-color: var(--priority-low); color: var(--text); }
  .fside b, .fask b { font-weight: 600; }

  .fnotes {
    font-family: inherit; font-size: 14px; line-height: 1.55; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 3px;
    padding: 11px 13px; width: 100%; resize: vertical; outline: none;
  }
  .fnotes:focus { border-color: var(--accent); }
  .fwho { background: transparent; }

  .fatts { display: flex; align-items: center; gap: 8px; }
  .fatt {
    width: 74px; height: 44px; border-radius: 3px; cursor: pointer;
    border: 1px dashed var(--border); background: none;
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; color: var(--text-tertiary);
  }
  .fatt.done { border-style: solid; border-color: var(--priority-high);
               background: var(--priority-high-bg); color: var(--priority-high); }
  .fatt.reached { border-color: var(--priority-low); background: var(--priority-low-bg); color: var(--priority-low); }
  .fatt-note { font-size: 13px; color: var(--text-tertiary); margin-left: 4px; }

  .fouts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
  .fouts.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .fout {
    min-height: 52px; border: 1px solid var(--border); border-radius: 3px;
    background: var(--surface); cursor: pointer;
    font-family: inherit; font-size: 14px; color: var(--text);
  }
  .fout:hover { border-color: var(--accent); }
  .fout.on { border-color: var(--priority-low); background: var(--priority-low); color: #FFF; font-weight: 500; }
  .fstage { display: flex; flex-direction: column; gap: 9px;
            border-left: 2px solid var(--priority-low); padding: 4px 0 2px 14px; margin-top: 10px; }
  .fstage[hidden] { display: none; }
  .famt { display: flex; align-items: center; gap: 2px; border: 1px solid var(--priority-low);
          background: var(--surface); border-radius: 3px; min-height: 46px; padding: 0 14px;
          width: 140px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 20px; }
  .famt[hidden] { display: none; }
  .famt span { color: var(--text-secondary); }
  .famt input { font-family: inherit; font-size: 20px; color: var(--text); background: none;
                border: none; outline: none; width: 100%; }

  .focus-foot { display: flex; align-items: center; justify-content: space-between;
                gap: 12px; border-top: 1px solid var(--border-light); padding-top: 16px; }
  .fskip { font-family: inherit; font-size: 13px; color: var(--text-secondary);
           background: none; border: none; cursor: pointer; padding: 6px 2px; }
  .fskip:hover { color: var(--text); }
  .fnext { min-height: 44px; padding: 0 20px; border: 1px solid var(--accent); background: var(--accent);
           color: #FFF; border-radius: 3px; cursor: pointer; font-family: inherit;
           font-size: 14px; font-weight: 500; }
  .fnext:hover { background: var(--accent-hover); }

  @media (max-width: 560px) {
    .fgrid { grid-template-columns: 1fr; }
    .fouts, .fouts.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .fname { font-size: 28px; }
  }

  .start-btn {
    font-family: inherit; font-size: 11px; font-weight: 500; color: #FFF;
    background: var(--accent); border: 1px solid var(--accent); border-radius: 4px;
    padding: 4px 10px; cursor: pointer; white-space: nowrap;
  }
  .start-btn:hover { background: var(--accent-hover); }
  .row-open {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px;
    color: var(--text-tertiary); background: none; border: none;
    cursor: pointer; padding: 0; line-height: 1;
  }
  .row-open:hover { color: var(--accent); }

  .setup-banner {
    background: var(--priority-high-bg); border: 1px solid var(--priority-high);
    border-radius: 3px; padding: 12px 16px; margin-bottom: 20px;
    font-size: 13px; line-height: 1.6;
  }
  .setup-banner.info {
    background: transparent; border-color: var(--border);
    color: var(--text-secondary); padding: 7px 12px; margin-bottom: 14px;
  }

  .filters { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .fbtn {
    font-family: inherit; font-size: 13px; font-weight: 500;
    color: var(--text-tertiary); background: none; border: none;
    padding: 4px 1px 5px; cursor: pointer;
    border-bottom: 2px solid transparent; transition: color .12s, border-color .12s;
  }
  .fbtn:hover { color: var(--text-secondary); }
  .fbtn.active { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
  .fbtn .cnt { color: var(--text-tertiary); margin-left: 5px; font-weight: 400; font-variant-numeric: tabular-nums; }

  /* Collapsed by default: after the first day nobody needs to be told what a
     green box means, so this is a reference to reopen, not a banner to read. */
  .legend { margin: -6px 0 16px; }
  .legend summary {
    display: inline-block; list-style: none; cursor: pointer;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--text-tertiary);
  }
  .legend summary::-webkit-details-marker { display: none; }
  .legend summary::after { content: ' +'; }
  .legend[open] summary::after { content: ' \2212'; }
  .legend summary:hover { color: var(--text-secondary); }
  .legend .keys {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    font-size: 12px; color: var(--text-tertiary); margin-top: 9px;
  }
  .legend .key { display: inline-flex; align-items: center; gap: 7px; }
  .att.sample {
    pointer-events: none; cursor: default;
    width: 34px; display: inline-flex; align-items: center; justify-content: center;
  }

  /* Tag colours live on the definition in campaign_settings rather than in
     CSS, so a tag added from the UI carries its colour without a deploy. */
  .tagfilters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: -8px 0 16px; }
  .tfbtn {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--tc); border: 1px solid var(--tc); background: none;
    border-radius: 2px; padding: 3px 7px; cursor: pointer; opacity: .5;
  }
  .tfbtn:hover { opacity: .8; }
  .tfbtn.on { opacity: 1; background: color-mix(in srgb, var(--tc) 14%, transparent); font-weight: 600; }
  .tfbtn .cnt { margin-left: 5px; opacity: .7; font-variant-numeric: tabular-nums; }
  /* The master list stays neutral so the working lists carry the colour. */
  .tfbtn.master {
    --tc: var(--text-tertiary);
    border-style: dashed; opacity: .55;
  }
  .tfbtn.master.on { opacity: 1; border-style: solid; color: var(--text-secondary); background: none; }
  .tag-add {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-tertiary); background: none; border: 1px dashed var(--border);
    border-radius: 2px; padding: 3px 7px; cursor: pointer;
  }
  .tag-add:hover { color: var(--accent); border-color: var(--accent); }
  .tag-new {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 9px;
    letter-spacing: 0.06em; text-transform: uppercase;
    border: 1px solid var(--accent); border-radius: 2px;
    padding: 3px 7px; width: 140px; background: var(--surface); color: var(--text);
  }
  .tag-cell {
    display: flex; gap: 3px; align-items: center;
    min-width: 0; overflow: hidden; cursor: pointer; padding: 2px 0;
  }
  .tag-chip {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 9px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--tc); border: 1px solid var(--tc);
    background: color-mix(in srgb, var(--tc) 12%, transparent);
    border-radius: 2px; padding: 1px 4px; white-space: nowrap;
    /* A long tag name truncates inside its own column rather than running
       under the attempt boxes. */
    display: inline-block; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis;
  }
  .tag-empty { font-size: 12px; color: var(--text-tertiary); opacity: 0; transition: opacity .12s; }
  .row:hover .tag-empty { opacity: 1; }
  .tag-pop {
    position: absolute; z-index: 40;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 6px; min-width: 176px;
    box-shadow: 0 6px 20px rgba(0,0,0,.10);
    display: flex; flex-direction: column; gap: 2px;
  }
  .tag-opt {
    display: flex; align-items: center; gap: 7px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-secondary); background: none; border: none;
    border-radius: 3px; padding: 5px 6px; cursor: pointer; text-align: left;
  }
  .tag-opt:hover { background: var(--hover); }
  .tag-opt .box { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; border: 1px solid var(--tc); }
  .tag-opt.on { color: var(--text); }
  .tag-opt.on .box { background: var(--tc); }

  .thead, .row {
    display: grid;
    grid-template-columns: 14px 1fr 150px 132px 34px 34px 34px 74px 1fr 26px 24px;
    gap: 10px; align-items: center;
  }
  .thead {
    padding: 8px 0; border-bottom: 1px solid var(--border);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--text-tertiary);
  }
  .row { padding: 9px 0; border-bottom: 1px solid var(--border-light); }
  .row:hover { background: var(--hover); }
  .row.gave .nm { color: var(--text-secondary); }
  .row.gave { opacity: .66; }
  .row.gave:hover { opacity: 1; }

  /* Berkeley residency drives the 6:1 match, so it gets the leftmost slot
     rather than being buried in a column you have to scan for. */
  .bky {
    width: 10px; height: 10px; padding: 0; border-radius: 2px;
    border: 1.5px solid var(--border); background: none; cursor: pointer;
  }
  .bky:hover { border-color: var(--priority-low); }
  .bky.on { background: var(--priority-low); border-color: var(--priority-low); }

  .cell { font-family: inherit; font-size: 14px; color: var(--text);
          background: none; border: none; outline: none; width: 100%; padding: 1px 0; }
  .cell::placeholder { color: var(--text-tertiary); }
  .nm { font-size: 14px; }
  .contact { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .contact a {
    font-size: 12px; color: var(--text-secondary); text-decoration: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .contact a:hover { color: var(--accent); text-decoration: underline; }
  .contact .tel { font-variant-numeric: tabular-nums; }

  /* One click logs the attempt as not-reached, which is the common outcome.
     A second click flips it to reached. */
  .att {
    height: 26px; border-radius: 3px; cursor: pointer;
    border: 1px dashed var(--border); background: none;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 9px; color: var(--text-tertiary); padding: 0;
  }
  .att:hover { border-color: var(--accent); color: var(--accent); }
  /* Logged but not reached reads as unfinished business, so it carries the
     same red as an overdue task rather than a neutral grey. Reached stays
     green — the two states should be tellable apart at a glance down a column. */
  .att.done {
    border-style: solid; border-color: var(--priority-high);
    background: var(--priority-high-bg); color: var(--priority-high);
  }
  .att.reached {
    border-color: var(--priority-low); background: var(--priority-low-bg);
    color: var(--priority-low); font-weight: 600;
  }

  .gave-cell { display: flex; align-items: center; gap: 6px; }
  .gave-box {
    width: 14px; height: 14px; flex-shrink: 0; border-radius: 2px;
    border: 1.5px solid var(--border); background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #fff; line-height: 1;
  }
  .gave-box.on { background: var(--priority-low); border-color: var(--priority-low); }
  .gave-date { font-size: 11px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }

  .del { background: none; border: none; color: var(--text-tertiary);
         font-size: 15px; cursor: pointer; opacity: 0; padding: 0; }
  .row:hover .del { opacity: 1; }
  .del:hover { color: var(--priority-high); }

  .add-row { padding: 14px 0; }
  .add-btn {
    font-family: inherit; font-size: 13px; color: var(--text-tertiary);
    background: none; border: none; cursor: pointer; padding: 4px 0;
  }
  .add-btn:hover { color: var(--accent); }

  .empty { padding: 40px 16px; text-align: center; color: var(--text-tertiary); font-size: 13px; }

  @media (max-width: 820px) {
    .app { padding: 24px 12px 60px; }
    .thead, .row { grid-template-columns: 14px 1fr 34px 34px 34px 60px 26px 24px; }
    .thead .c-contact, .thead .c-notes, .thead .c-tags,
    .row .contact, .row .notes, .row .tag-cell { display: none; }
  }
</style>
</head>
<body>

<nav class="site-nav" id="siteNav">
  <a href="../index.html">Tasks</a>
  <a href="../questionnaires/index.html">Questionnaires</a>
  <a href="../donors/index.html">Fundraising</a>
  <a href="../calendar/index.html">Calendar</a>
  <a href="index.html" class="active">Call Time</a>
</nav>

<div class="auth-gate" id="authGate">
  <div class="auth-card">
    <div class="auth-title">Call Time</div>
    <div class="auth-sub">Enter the campaign passphrase to continue.</div>
    <input class="auth-input" id="authPass" type="password" placeholder="Passphrase" autocomplete="current-password">
    <button class="auth-btn" id="authBtn">Sign in</button>
    <div class="auth-error" id="authError" style="display:none"></div>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <div id="setupNotice" style="display:none"></div>

  <div class="header">
    <div class="page-title">Call time</div>
    <button class="sync-btn" id="syncBtn" title="Re-read the spreadsheet">Refresh from sheet</button>
    <button class="start-btn" id="startBtn" title="Work this list one at a time">Start calling &rarr;</button>
    <div class="save-indicator" id="saveIndicator"><span class="save-dot"></span><span class="save-label"></span></div>
  </div>

  <div class="filters" id="filters"></div>
  <div class="tagfilters" id="tagFilters"></div>
  <details class="legend" id="legend">
    <summary>Key</summary>
    <div class="keys">
      <span class="key"><span class="att sample">+</span> not called</span>
      <span class="key"><span class="att sample done">8/13</span> no contact</span>
      <span class="key"><span class="att sample reached">8/13</span> reached</span>
    </div>
  </details>

  <div class="thead">
    <div></div>
    <div>Name</div>
    <div class="c-contact">Contact</div>
    <div class="c-tags">Tags</div>
    <div class="c-att" title="Click to log an attempt · again to mark reached · again to clear">1</div>
    <div class="c-att" title="Click to log an attempt · again to mark reached · again to clear">2</div>
    <div class="c-att" title="Click to log an attempt · again to mark reached · again to clear">3</div>
    <div>Gave</div>
    <div class="c-notes">Notes</div>
    <div></div>
  </div>
  <div id="rows"></div>
  <div class="add-row"><button class="add-btn" id="addBtn">+ Add contact</button></div>
</div>

<!-- Focus view. One person at a time, for use while actually on the phone; the
     table behind it is for planning a session, not for working through one. -->
<div class="focus" id="focus" hidden>
  <div class="focus-card">
    <div class="focus-top">
      <div class="focus-prog" id="fProg"></div>
      <button class="focus-x" id="fClose" title="Back to the list (Esc)">Close</button>
    </div>
    <div class="focus-bar"><div id="fBar"></div></div>

    <div class="focus-name">
      <span class="fpri" id="fPri"></span>
      <div>
        <div class="fname" id="fName"></div>
        <span class="tag-chip" id="fTag"></span>
      </div>
    </div>

    <a class="focus-tel" id="fTel"></a>
    <a class="focus-mail" id="fMail"></a>

    <div class="fblock">
      <div class="flabel">Who they are</div>
      <textarea class="fnotes fwho" id="fWho" rows="2"></textarea>
    </div>

    <div class="fgrid">
      <div class="fblock">
        <div class="flabel">The ask</div>
        <div class="fask" id="fAsk"></div>
      </div>
      <div class="fblock">
        <div class="flabel" id="fSideLabel"></div>
        <div class="fside" id="fSide"></div>
      </div>
    </div>

    <div class="fblock">
      <div class="flabel">Call history</div>
      <div class="fatts" id="fAtts"></div>
    </div>

    <div class="fblock">
      <div class="flabel">How did it go</div>
      <div class="fouts" id="fOut1"></div>
      <div class="fstage" id="fStage" hidden>
        <div class="flabel">And the outcome</div>
        <div class="fouts four" id="fOut2"></div>
        <div class="famt" id="fAmt" hidden>
          <span>$</span><input id="fAmtIn" type="number" min="0" max="60" step="1" inputmode="numeric">
        </div>
      </div>
    </div>

    <div class="fblock">
      <div class="flabel">Notes</div>
      <textarea class="fnotes" id="fNote" rows="3" placeholder="What did they say?"></textarea>
    </div>

    <div class="focus-foot">
      <button class="fskip" id="fSkip">Skip</button>
      <button class="fnext" id="fNext">Next &rarr;</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://qhrtqtnrduambvchjxqw.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_UAG7Ru6PRdNnOLCbchpQVg_8vE0jG5N';
  var AUTH_EMAIL   = 'questionnaire@dariaforberkeley.com';

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  var contacts = [];
  var filter = 'todo';

  // --- the sheet ---------------------------------------------------------
  // The Google Sheet is the source of truth. Supabase is kept as a warm mirror
  // so the page still opens when the sheet is unreachable, but on a normal load
  // every row on screen came from the sheet.
  //
  // Talks to /__hq/sheet on this origin, never to Google directly: the shared
  // token lives in a Cloudflare secret and must not reach the browser.
  var SHEET = {
    live: false,          // did this session's rows actually come from the sheet
    tabByKey: {}          // tag key -> tab name
  };

  function slugOf(s) {
    return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
  }

  // A tab name IS the category: "Endorsement ACD" -> endorsement_acd, which is
  // already the tag key the portal stores. "Untagged" is the one special case —
  // it means no tag at all, not a tag called "untagged".
  function tabToKey(tab) {
    var s = slugOf(tab);
    return s === 'untagged' ? '' : s;
  }
  function keyToTab(key) {
    return SHEET.tabByKey[key || ''] || (key ? null : 'Untagged');
  }

  async function sheetCall(method, body) {
    var opt = { method: method, cache: 'no-store', credentials: 'same-origin' };
    if (body) {
      opt.headers = { 'Content-Type': 'application/json' };
      opt.body = JSON.stringify(body);
    }
    var r = await fetch('/__hq/sheet', opt);
    var j = null;
    try { j = await r.json(); } catch (e) { /* fall through to the throw */ }
    if (!r.ok || !j || j.ok === false) {
      var e2 = new Error((j && j.error) || ('Sheet request failed (HTTP ' + r.status + ')'));
      e2.code = (j && j.code) || 'error';
      throw e2;
    }
    return j;
  }

  // --- the write queue -----------------------------------------------------
  // Every edit is queued rather than sent, for three reasons that only show up
  // under real use: a round trip to Apps Script costs seconds, so waiting on
  // each one makes a call session crawl; a dropped connection would otherwise
  // lose the click outright, because the UI has already moved on; and rapid
  // edits sent in parallel race for the script lock and time each other out.
  //
  // The queue coalesces per row, persists across reloads, and retries with
  // backoff. Nothing is lost because a phone locked or wifi blipped.
  var QKEY = 'calltimeQueue.v1';
  var queue = [];
  var flushTimer = null, inFlight = false, backoff = 0;

  function saveQueue() {
    try { localStorage.setItem(QKEY, JSON.stringify(queue)); } catch (e) { /* private mode */ }
  }
  function loadQueue() {
    try {
      var raw = localStorage.getItem(QKEY);
      var q = raw ? JSON.parse(raw) : [];
      if (Array.isArray(q)) queue = q;
    } catch (e) { queue = []; }
  }

  function pendingNote() {
    if (!queue.length) return;
    setSave('saving', queue.length === 1 ? '1 unsaved' : queue.length + ' unsaved');
  }

  // Merge into a pending write for the same row instead of appending. Logging an
  // attempt, marking the outcome and typing a note become ONE write rather than
  // three, which is where most of the speed comes from.
  function enqueueOp(op) {
    if (op.action === 'update') {
      for (var i = queue.length - 1; i >= 0; i--) {
        var q = queue[i];
        if (q.id !== op.id) continue;
        if (q.action === 'update' || q.action === 'insert') {
          for (var k in op.fields) q.fields[k] = op.fields[k];
          if (op.tab) { q.tab = op.tab; q.category = op.category; }
          if (op.from && !q.from) q.from = op.from;
          saveQueue(); scheduleFlush(); return;
        }
        break;   // a delete sits between: do not merge across it
      }
    }
    if (op.action === 'delete') {
      queue = queue.filter(function (q) { return q.id !== op.id; });
    }
    queue.push(op); saveQueue(); scheduleFlush();
  }

  function scheduleFlush(delay) {
    if (flushTimer || inFlight || !queue.length) return;
    flushTimer = setTimeout(flush, delay == null ? 700 : delay);
  }

  async function flush() {
    flushTimer = null;
    if (inFlight || !queue.length || !SHEET.live) return;
    inFlight = true;
    var batch = queue.slice(0, 50);
    var ok = false;
    try {
      var res = await sheetCall('POST', { action: 'batch', ops: batch });
      ok = true;
      // Drop exactly what was sent. Anything queued while in flight stays.
      queue = queue.slice(batch.length);
      saveQueue();
      backoff = 0;
      var failed = (res.results || []).filter(function (r) { return r && r.ok === false; });
      if (failed.length) {
        setSave('error', failed.length + ' row(s) rejected');
        console.warn('sheet rejected', failed);
      } else if (queue.length) {
        pendingNote();
      } else {
        setSave('saved');
      }
    } catch (e) {
      // Keep the batch and come back for it. Doubling from 2s to a 30s ceiling
      // rides out a tunnel or a flaky hotspot without hammering the script.
      backoff = Math.min(backoff ? backoff * 2 : 2000, 30000);
      setSave('error', 'Offline — ' + queue.length + ' unsaved, retrying');
    } finally {
      inFlight = false;
    }
    if (queue.length) scheduleFlush(ok ? 120 : backoff);
  }

  // A locked phone or a closed tab should not strand the queue: try once more on
  // the way out, and again as soon as the page is looked at.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') scheduleFlush(0);
  });
  window.addEventListener('beforeunload', function (e) {
    if (queue.length) { e.preventDefault(); e.returnValue = ''; }
  });

  // Sheet dates carry no time of day. Anchoring at local noon keeps a date from
  // sliding to the previous day once it is rendered back in Pacific time.
  function dateToIso(d) {
    var m = String(d || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return null;
    return new Date(+m[1], +m[2] - 1, +m[3], 12, 0, 0).toISOString();
  }

  function sheetRowToContact(r, tab, idx) {
    var attempts = [];
    (r.attempts || []).forEach(function (a) {
      var iso = dateToIso(a);
      attempts.push(iso ? { at: iso, reached: /✓/.test(String(a)) } : null);
    });
    while (attempts.length && attempts[attempts.length - 1] == null) attempts.pop();
    var key = tabToKey(tab);
    return {
      id: r.id,
      name: r.name || '',
      email: r.email || '',
      phone: r.phone || '',
      berkeley: !!r.berkeley,
      attempts: attempts,
      gave: !!r.gave,
      gave_on: r.gave_on || null,
      gave_amount: r.gave_amount == null ? null : r.gave_amount,
      tags: key ? [key] : [],
      notes: r.notes || '',
      status: r.status || '',
      priority: String(r.priority || ''),
      sort_order: idx,
      // Which tab this row was read from, so a write can say where to look
      // instead of making the script scan the whole workbook.
      _tab: tab
    };
  }

  function attemptCell(a) {
    if (!a || !a.at) return '';
    var d = new Date(a.at);
    if (isNaN(d)) return '';
    var s = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
            '-' + String(d.getDate()).padStart(2, '0');
    return a.reached ? s + ' ✓' : s;
  }

  // Portal-shaped fields in, sheet column headers out. Attempts and tags are the
  // two that do not map one-to-one: three columns out of one array, and a tab
  // move out of one tag.
  function toSheetFields(fields, c) {
    var out = {};
    if ('name' in fields)  out['Name'] = fields.name;
    if ('email' in fields) out['Email'] = fields.email;
    if ('phone' in fields) out['Phone'] = fields.phone;
    if ('notes' in fields) out['Notes'] = fields.notes;
    if ('status' in fields) out['Status'] = fields.status;
    if ('berkeley' in fields) out['Berkeley'] = fields.berkeley ? 'TRUE' : 'FALSE';
    if ('gave' in fields) out['Gave'] = fields.gave ? 'YES' : '';
    if ('gave_on' in fields) out['Gave on'] = fields.gave_on || '';
    if ('gave_amount' in fields) out['Amount'] = fields.gave_amount == null ? '' : fields.gave_amount;
    if ('attempts' in fields) {
      var a = fields.attempts || [];
      out['Attempt 1'] = attemptCell(a[0]);
      out['Attempt 2'] = attemptCell(a[1]);
      out['Attempt 3'] = attemptCell(a[2]);
      out['Reached'] = a.some(function (x) { return x && x.reached; }) ? 'YES' : '';
    }
    if ('tags' in fields) {
      var k = (fields.tags && fields.tags[0]) || '';
      var d = k ? tagDef(k) : null;
      out['Category'] = d ? d.label : (k || 'Untagged');
    }
    return out;
  }

  // Seeded, not hardcoded: definitions persist in campaign_settings so tags can
  // be added from the UI without a migration or a deploy.
  var DEFAULT_TAGS = [
    { key: 'fundraise',          label: 'Fundraise',          color: '#C89B2A' },
    { key: 'fundraise_personal', label: 'Fundraise personal', color: '#C4784A' },
    { key: 'endorsement',        label: 'Endorsement',        color: '#6B956B' },
    { key: 'volunteer',          label: 'Volunteer',          color: '#4A6FA5' },
    { key: 'house_party',        label: 'House party',        color: '#8B6BA5' }
  ];
  var TAGS = DEFAULT_TAGS.slice();
  var tagFilter = '';   // one tag key, or '' for the master list. ANDed with `filter`.
  var openPop = null;

  function tagDef(k) {
    for (var i = 0; i < TAGS.length; i++) if (TAGS[i].key === k) return TAGS[i];
    return null;
  }
  function tagsOf(c) { return Array.isArray(c.tags) ? c.tags : []; }

  async function saveTagDefs() {
    var r = await sb.from('campaign_settings')
      .upsert({ key: 'callTagDefs', value: JSON.stringify(TAGS) });
    if (r && r.error) setSave('error', r.error.message);
  }

  async function addTagDef(label) {
    label = (label || '').trim();
    if (!label) return;
    var key = label.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
    if (!key || tagDef(key)) return;
    var palette = ['#C89B2A', '#C4784A', '#6B956B', '#4A6FA5', '#8B6BA5', '#C45240', '#4A8B8B'];
    TAGS.push({ key: key, label: label, color: palette[TAGS.length % palette.length] });
    buildTagFilters(); render();
    await saveTagDefs();
  }

  // A contact belongs to one category, so picking a tag replaces whatever was
  // there rather than adding to it. Picking the one already set clears it, which
  // is the only way to get back to untagged. Still stored as an array so the
  // column and the backfill SQL do not need to change.
  async function setTag(c, key) {
    var prev = tagsOf(c).slice();
    var next = (prev.length === 1 && prev[0] === key) ? [] : [key];
    c.tags = next;
    render(); buildTagFilters();
    var ok = await patch(c.id, { tags: next });
    if (!ok) { c.tags = prev; render(); buildTagFilters(); }
  }

  function closeTagPop() {
    if (openPop) { openPop.remove(); openPop = null; }
    document.removeEventListener('mousedown', onPopOutside, true);
  }
  function onPopOutside(e) { if (openPop && !openPop.contains(e.target)) closeTagPop(); }

  function openTagPop(ev, c) {
    closeTagPop();
    var pop = el('div', 'tag-pop');
    TAGS.forEach(function (t) {
      var on = tagsOf(c).indexOf(t.key) >= 0;
      var b = el('button', 'tag-opt' + (on ? ' on' : ''));
      b.style.setProperty('--tc', t.color);
      b.appendChild(el('span', 'box'));
      b.appendChild(document.createTextNode(t.label));
      b.addEventListener('click', function (ev) {
        ev.stopPropagation(); setTag(c, t.key); closeTagPop();
      });
      pop.appendChild(b);
    });
    document.body.appendChild(pop);
    // Prefer the cell's rect, but fall back to the pointer when that rect is
    // degenerate — a zero-width rect would otherwise clamp the popover into the
    // top-left corner instead of placing it under the tag.
    var r = ev.currentTarget && ev.currentTarget.getBoundingClientRect();
    var x = (r && r.width) ? r.left : ev.clientX;
    var y = (r && r.width) ? r.bottom : ev.clientY;
    pop.style.left = Math.max(8, Math.min(x, window.innerWidth - pop.offsetWidth - 12)) + 'px';
    pop.style.top = (y + window.scrollY + 4) + 'px';
    openPop = pop;
    setTimeout(function () { document.addEventListener('mousedown', onPopOutside, true); }, 0);
  }

  function buildTagFilters() {
    var w = document.getElementById('tagFilters');
    if (!w) return;
    w.textContent = '';
    var f = FILTERS.filter(function (x) { return x.k === filter; })[0];
    var base = contacts.filter(f.fn);
    // These are separate call lists, not overlapping facets, so exactly one is
    // active at a time. The master list is first but deliberately quiet: it is
    // the fallback view, not the one being worked.
    var all = el('button', 'tfbtn master' + (tagFilter ? '' : ' on'), 'All');
    all.appendChild(el('span', 'cnt', String(base.length)));
    all.addEventListener('click', function () { tagFilter = ''; buildTagFilters(); render(); });
    w.appendChild(all);

    TAGS.forEach(function (t) {
      var on = tagFilter === t.key;
      var b = el('button', 'tfbtn' + (on ? ' on' : ''), t.label);
      b.style.setProperty('--tc', t.color);
      b.appendChild(el('span', 'cnt', String(base.filter(function (c) {
        return tagsOf(c).indexOf(t.key) >= 0;
      }).length)));
      b.addEventListener('click', function () {
        tagFilter = (tagFilter === t.key) ? '' : t.key;
        buildTagFilters(); render();
      });
      w.appendChild(b);
    });
    var add = el('button', 'tag-add', '+ Tag');
    add.addEventListener('click', function () {
      var inp = document.createElement('input');
      inp.className = 'tag-new'; inp.placeholder = 'New tag';
      add.replaceWith(inp); inp.focus();
      function done(commit) {
        var v = inp.value;
        inp.replaceWith(add);
        if (commit) addTagDef(v);
      }
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') done(true);
        if (e.key === 'Escape') done(false);
      });
      inp.addEventListener('blur', function () { done(false); });
    });
    w.appendChild(add);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  var saveTimer = null;
  function setSave(state, msg) {
    var e = document.getElementById('saveIndicator');
    var l = e.querySelector('.save-label');
    clearTimeout(saveTimer);
    e.className = 'save-indicator visible ' + state;
    l.textContent = msg || (state === 'saving' ? 'Saving' : state === 'saved' ? 'Saved' : 'Save failed');
    if (state !== 'saving') saveTimer = setTimeout(function () { e.className = 'save-indicator'; }, 2400);
  }

  function fmtPhone(p) {
    var d = String(p || '').replace(/\D/g, '');
    if (d.length === 11 && d[0] === '1') d = d.slice(1);
    if (d.length !== 10) return p || '';
    return '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6);
  }
  function fmtWhen(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return (d.getMonth() + 1) + '/' + d.getDate();
  }
  function fmtFull(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var h = d.getHours(), ap = h >= 12 ? 'pm' : 'am', h12 = h % 12 || 12;
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + h12 + ':' +
           String(d.getMinutes()).padStart(2, '0') + ap;
  }

  // Mirror into Supabase so the fallback copy stays warm. Deliberately not
  // awaited by the caller and deliberately silent: the sheet is the source of
  // truth, and a mirror failure must not make a successful save look failed.
  function mirror(id, fields) {
    sb.from('call_contacts').update(fields).eq('id', id).then(function (r) {
      if (r && r.error) console.warn('mirror to Supabase failed', r.error.message);
    });
  }

  async function patch(id, fields) {
    if (SHEET.live) {
      var c = contacts.filter(function (x) { return x.id === id; })[0];
      var op = { action: 'update', id: id, fields: toSheetFields(fields, c) };
      if (c && c._tab) op.from = c._tab;
      // A category change is a move between tabs, so the destination travels
      // with the write. An unknown tag has no tab to move to; the Category cell
      // still updates and the row simply stays where it is.
      if ('tags' in fields) {
        var moveTo = keyToTab((fields.tags && fields.tags[0]) || '');
        if (moveTo) {
          op.tab = moveTo;
          op.category = op.fields['Category'];
          if (c) c._tab = moveTo;   // so the next write hints at the new tab
        }
      }
      enqueueOp(op);
      pendingNote();
      mirror(id, fields);
      return true;
    }

    setSave('saving');
    var r = await sb.from('call_contacts').update(fields).eq('id', id);
    if (r.error) {
      setSave('error', r.error.message);
      // 42703 is undefined_column. A rejected write that still shows on screen is
      // worse than a visible failure, so name the missing migration rather than
      // leaving a generic error next to a change that looks like it saved.
      if (r.error.code === '42703' && /tags/.test(r.error.message || '')) {
        setSetupNotice('Tags need a column that does not exist yet. Run this in the ' +
          'Supabase SQL Editor, then reload:  alter table call_contacts ' +
          "add column if not exists tags jsonb not null default '[]'::jsonb;");
      }
      return false;
    }
    setSave('saved');
    return true;
  }

  // --- data ---
  // Priority is set in the sheet and is the whole point of the sheet round
  // trip, so it drives the order here. Blank sorts last rather than first: an
  // unranked contact is not a top priority.
  function sortContacts() {
    contacts.sort(function (a, b) {
      var pa = parseInt(a.priority, 10), pb = parseInt(b.priority, 10);
      if (isNaN(pa)) pa = 99;
      if (isNaN(pb)) pb = 99;
      if (pa !== pb) return pa - pb;
      return (a.sort_order || 0) - (b.sort_order || 0);
    });
  }

  function applySheet(j) {
    var rows = [], idx = 0;
    SHEET.tabByKey = {};
    (j.tabs || []).forEach(function (t) {
      SHEET.tabByKey[tabToKey(t.tab)] = t.tab;
      (t.rows || []).forEach(function (r) {
        if (!r.id) return;   // a row the sheet has not been given an id for yet
        rows.push(sheetRowToContact(r, t.tab, idx++));
      });
    });
    contacts = rows;
    SHEET.live = true;

    // The sheet owns the category list now, so a tab the portal has never seen
    // has to become a tag here or its contacts render with no chip and get no
    // filter — invisible except under "All". Existing definitions are left
    // alone so a hand-picked label and colour survive.
    var palette = ['#C89B2A', '#C4784A', '#6B956B', '#4A6FA5', '#8B6BA5', '#C45240', '#4A8B8B'];
    var added = false;
    (j.tabs || []).forEach(function (t) {
      var k = tabToKey(t.tab);
      if (!k || tagDef(k)) return;
      TAGS.push({ key: k, label: t.tab, color: palette[TAGS.length % palette.length] });
      added = true;
    });
    if (added) saveTagDefs();
  }

  async function loadFromSupabase() {
    var r = await sb.from('call_contacts').select('*').order('sort_order').order('created_at');
    if (r.error) throw r.error;
    contacts = (r.data || []).map(function (c) { c.priority = c.priority || ''; return c; });
    SHEET.live = false;
  }

  // Bring the mirror in line with the sheet, which is the source of truth.
  // Without this the two drift apart in both directions: someone deleted in the
  // sheet by hand lingers in Supabase and comes back the next time the fallback
  // is used, and someone pasted in never gets there at all. Best-effort and
  // never awaited — the sheet is already on screen by this point.
  function reconcileMirror() {
    sb.from('call_contacts').select('id').then(function (r) {
      if (!r || r.error || !r.data) return;
      var live = {}, have = {};
      contacts.forEach(function (c) { live[c.id] = c; });
      r.data.forEach(function (x) { have[x.id] = true; });

      var stale = r.data.filter(function (x) { return !live[x.id]; }).map(function (x) { return x.id; });
      if (stale.length) sb.from('call_contacts').delete().in('id', stale).then(function () {});

      var missing = contacts.filter(function (c) { return !have[c.id]; }).map(function (c) {
        return {
          id: c.id, name: c.name, email: c.email, phone: c.phone,
          berkeley: c.berkeley, attempts: c.attempts, gave: c.gave,
          gave_on: c.gave_on, gave_amount: c.gave_amount, tags: c.tags,
          notes: c.notes, sort_order: c.sort_order
        };
      });
      if (missing.length) sb.from('call_contacts').insert(missing).then(function () {});
      if (stale.length || missing.length) {
        console.info('mirror reconciled: +' + missing.length + ' -' + stale.length);
      }
    });
  }

  /**
   * The sheet is authoritative but slow — a full read measures around four
   * seconds. Rather than hold a blank page for that, the mirror and the sheet
   * are fetched together and the mirror paints first if it wins, then the sheet
   * replaces it. The list is usable almost immediately and settles on the real
   * data without anyone waiting on it.
   *
   * `paint` re-renders; it is passed in so this stays out of the render layer.
   */
  async function load(paint) {
    await loadTagDefs();          // tag labels are needed to write Category back
    paint = paint || function () {};

    var settled = false;
    var sheetP = sheetCall('GET');
    sheetP.catch(function () {});   // handled below; this only stops an unhandled rejection

    var mirrorP = loadFromSupabase().then(function () {
      // Only paint the mirror if the sheet has not already landed, so nobody
      // sees the list rebuild itself for no reason.
      if (settled) return;
      sortContacts();
      setSetupNotice('Loading the spreadsheet…', 'info');
      paint();
    }, function () {});

    try {
      var j = await sheetP;
      settled = true;
      applySheet(j);
      sortContacts();
      setSetupNotice('');
      paint();
      reconcileMirror();
      scheduleFlush(0);   // SHEET.live is only true now; drain anything held over
      if (j.minted) {
        setSave('saved', j.minted + ' new from sheet');
      }
    } catch (e) {
      settled = true;
      // Falling back rather than failing: a call list you cannot open is worse
      // than one that is a few minutes stale. Say plainly which copy is on
      // screen, because edits made here will not reach the spreadsheet.
      await mirrorP;
      sortContacts();
      setSetupNotice('Working from the backup copy — the sheet is unreachable (' +
        (e.message || 'unknown error') + '). Changes made now will NOT appear in ' +
        'the spreadsheet. Reload once it is back.');
      paint();
    }
  }

  // Tag definitions are shared campaign state, so they live in campaign_settings
  // next to the task tracker's. A missing row just means the seeded set stands.
  async function loadTagDefs() {
    var r = await sb.from('campaign_settings').select('*').eq('key', 'callTagDefs');
    if (r.error || !r.data || !r.data.length) return;
    try {
      var parsed = JSON.parse(r.data[0].value);
      if (Array.isArray(parsed) && parsed.length) TAGS = parsed;
    } catch (e) { /* keep the seeded defaults */ }
  }

  function attemptsOf(c) { return Array.isArray(c.attempts) ? c.attempts : []; }

  // Click cycles: empty -> logged (no answer) -> reached -> empty.
  // A cycle rather than a modifier key, because an accidental stamp has to be
  // clearable by someone who does not know a shortcut, and these targets are
  // too small to carry a separate delete control.
  async function cycleAttempt(c, idx) {
    var a = attemptsOf(c).slice();
    var cur = a[idx];
    if (!cur) {
      while (a.length < idx) a.push(null);
      a[idx] = { at: new Date().toISOString(), reached: false };
    } else if (!cur.reached) {
      a[idx] = { at: cur.at, reached: true };
    } else {
      a[idx] = null;
      while (a.length && a[a.length - 1] == null) a.pop();
    }
    c.attempts = a;
    render();
    await patch(c.id, { attempts: a });
  }

  async function toggleGave(c) {
    c.gave = !c.gave;
    c.gave_on = c.gave ? new Date().toISOString().slice(0, 10) : null;
    render(); buildFilters(); buildTagFilters();
    await patch(c.id, { gave: c.gave, gave_on: c.gave_on });
  }

  async function addContact() {
    setSave('saving');

    if (SHEET.live) {
      // The id is minted here rather than by the sheet so the new row can be
      // focused immediately and so a retry cannot append the person twice.
      var id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
             : 'x' + Date.now() + Math.random().toString(16).slice(2);
      // New contacts land in whichever list is being worked. Adding someone
      // while filtered to Endorsement ACD and finding them in Untagged is a
      // small papercut that costs a drag in the sheet to undo.
      var tab = keyToTab(tagFilter) || 'Untagged';
      enqueueOp({ action: 'insert', id: id, tab: tab,
                  fields: { 'Name': '', 'Berkeley': 'FALSE', 'Category': tab } });
      pendingNote();
      var fresh = {
        id: id, name: '', email: '', phone: '', berkeley: false, attempts: [],
        gave: false, gave_on: null, gave_amount: null,
        tags: tagFilter ? [tagFilter] : [], notes: '', priority: '',
        sort_order: contacts.length, _tab: tab
      };
      contacts.push(fresh);
      sb.from('call_contacts').insert({
        id: id, name: '', email: '', phone: '',
        tags: fresh.tags, sort_order: fresh.sort_order
      }).then(function (r) {
        if (r && r.error) console.warn('mirror insert failed', r.error.message);
      });
      render(); buildFilters(); buildTagFilters();
      var el2 = document.querySelector('.row[data-id="' + id + '"] .nm');
      if (el2) el2.focus();
      return;
    }

    var row = { name: '', email: '', phone: '', sort_order: contacts.length };
    var r = await sb.from('call_contacts').insert(row).select().single();
    if (r.error) { setSave('error'); return; }
    setSave('saved');
    r.data.priority = '';
    contacts.push(r.data);
    render(); buildFilters(); buildTagFilters();
    var inp = document.querySelector('.row[data-id="' + r.data.id + '"] .nm');
    if (inp) inp.focus();
  }

  async function removeContact(c) {
    if (!window.confirm('Remove ' + (c.name || 'this contact') + ' from the call list?')) return;
    setSave('saving');

    if (SHEET.live) {
      enqueueOp({ action: 'delete', id: c.id, from: c._tab });
      pendingNote();
      sb.from('call_contacts').delete().eq('id', c.id).then(function (r) {
        if (r && r.error) console.warn('mirror delete failed', r.error.message);
      });
      contacts = contacts.filter(function (x) { return x.id !== c.id; });
      render(); buildFilters(); buildTagFilters();
      return;
    }

    var r = await sb.from('call_contacts').delete().eq('id', c.id);
    if (r.error) { setSave('error'); return; }
    setSave('saved');
    contacts = contacts.filter(function (x) { return x.id !== c.id; });
    render(); buildFilters(); buildTagFilters();
  }

  // --- filters ---
  // Ordered the way call time actually runs: the list you are working, then the
  // people who asked to be tried again, then the ones already closed out.
  var FILTERS = [
    { k: 'todo',     label: 'To call',  fn: function (c) { return !c.gave && attemptsOf(c).filter(Boolean).length < 3; } },
    { k: 'reached',  label: 'Reached',  fn: function (c) { return attemptsOf(c).some(function (a) { return a && a.reached; }) && !c.gave; } },
    { k: 'gave',     label: 'Gave',     fn: function (c) { return c.gave; } },
    { k: 'all',      label: 'All',      fn: function () { return true; } }
  ];

  function buildFilters() {
    var w = document.getElementById('filters');
    w.innerHTML = '';
    FILTERS.forEach(function (f) {
      var b = el('button', 'fbtn' + (f.k === filter ? ' active' : ''), f.label);
      var c = el('span', 'cnt', String(contacts.filter(f.fn).length));
      b.appendChild(c);
      b.addEventListener('click', function () { filter = f.k; buildFilters(); buildTagFilters(); render(); });
      w.appendChild(b);
    });
  }

  // --- render ---
  function render() {
    var wrap = document.getElementById('rows');
    wrap.textContent = '';
    var f = FILTERS.filter(function (x) { return x.k === filter; })[0];
    var list = contacts.filter(f.fn).filter(function (c) {
      if (!tagFilter) return true;
      return tagsOf(c).indexOf(tagFilter) >= 0;
    });

    if (!list.length) {
      wrap.appendChild(el('div', 'empty', 'Nothing here.'));
      return;
    }

    list.forEach(function (c) {
      var row = el('div', 'row' + (c.gave ? ' gave' : ''));
      row.dataset.id = c.id;

      // Berkeley toggle
      var b = el('button', 'bky' + (c.berkeley ? ' on' : ''));
      b.title = c.berkeley ? 'Berkeley resident — contributions matched 6:1' : 'Mark as Berkeley resident';
      b.addEventListener('click', function () {
        c.berkeley = !c.berkeley; render(); buildFilters(); buildTagFilters();
        patch(c.id, { berkeley: c.berkeley });
      });
      row.appendChild(b);

      // name
      var nm = document.createElement('input');
      nm.className = 'cell nm'; nm.value = c.name || ''; nm.placeholder = 'Name';
      nm.addEventListener('change', function () { c.name = nm.value.trim(); patch(c.id, { name: c.name }); });
      row.appendChild(nm);


      // contact — tel: and mailto: so a click starts the call
      var ct = el('div', 'contact');
      if (c.phone) {
        var tel = el('a', 'tel', fmtPhone(c.phone));
        tel.href = 'tel:' + String(c.phone).replace(/[^\d+]/g, '');
        ct.appendChild(tel);
      }
      if (c.email) {
        var em = el('a', null, c.email);
        em.href = 'mailto:' + c.email;
        em.title = c.email;
        ct.appendChild(em);
      }
      if (!c.phone && !c.email) ct.appendChild(el('span', 'gave-date', 'no contact info'));
      row.appendChild(ct);

      // tags
      var tc = el('div', 'tag-cell');
      var d = tagsOf(c).length ? tagDef(tagsOf(c)[0]) : null;
      if (d) {
        var chip = el('span', 'tag-chip', d.label);
        chip.style.setProperty('--tc', d.color);
        tc.appendChild(chip);
      }
      if (!tc.childNodes.length) tc.appendChild(el('span', 'tag-empty', '+ tag'));
      tc.addEventListener('click', function (ev) { ev.stopPropagation(); openTagPop(ev, c); });
      row.appendChild(tc);

      // three attempt slots
      for (var i = 0; i < 3; i++) {
        (function (idx) {
          var a = attemptsOf(c)[idx];
          var btn = el('button', 'att' + (a ? (a.reached ? ' done reached' : ' done') : ''));
          btn.textContent = a ? fmtWhen(a.at) : '+';
          // The tooltip names the NEXT action, so the cycle is discoverable
          // without having to click through it to find out.
          btn.title = !a
            ? 'Log an attempt'
            : a.reached
              ? fmtFull(a.at) + ' — reached. Click to clear.'
              : fmtFull(a.at) + ' — no answer. Click to mark reached.';
          btn.addEventListener('click', function () { cycleAttempt(c, idx); });
          row.appendChild(btn);
        })(i);
      }

      // gave
      var g = el('div', 'gave-cell');
      var gb = el('button', 'gave-box' + (c.gave ? ' on' : ''), c.gave ? '✓' : '');
      gb.title = c.gave ? 'Gave' + (c.gave_on ? ' on ' + c.gave_on : '') : 'Mark as given';
      gb.addEventListener('click', function () { toggleGave(c); });
      g.appendChild(gb);
      if (c.gave && c.gave_on) g.appendChild(el('span', 'gave-date', c.gave_on.slice(5)));
      row.appendChild(g);

      // notes
      var nt = document.createElement('input');
      nt.className = 'cell notes'; nt.value = c.notes || ''; nt.placeholder = '—';
      nt.addEventListener('change', function () { c.notes = nt.value.trim(); patch(c.id, { notes: c.notes }); });
      row.appendChild(nt);

      // The way into the focus view. Trailing, so it reads as "go work this
      // one" rather than competing with the inline edits to its left.
      var open = el('button', 'row-open', '\u2192');
      open.title = 'Call ' + (c.name || 'this contact');
      open.addEventListener('click', function () { enterFocus(c); });
      row.appendChild(open);

      var d = el('button', 'del', '×');
      d.title = 'Remove';
      d.addEventListener('click', function () { removeContact(c); });
      row.appendChild(d);

      wrap.appendChild(row);
    });
  }

  // kind 'info' is for a passing state like "loading the spreadsheet" — the red
  // treatment is reserved for something actually being wrong, so that it keeps
  // meaning something when it does appear.
  // --- focus view ---------------------------------------------------------
  // A money ask and an endorsement ask are different calls. The card renders
  // whichever the contact's category implies, so nothing about dollars ever
  // appears on a call that is not about dollars.
  var STATUS_MONEY = ['Gave', 'Will think', 'Not now', 'No'];
  var STATUS_ENDORSE = ['Committed', 'Leaning yes', 'Undecided', 'No'];
  var focusList = [], focusIdx = -1;

  function isMoneyCall(c) {
    var k = (tagsOf(c)[0] || '');
    return k.indexOf('fundraise') === 0 || k.indexOf('house_party') === 0;
  }

  function currentList() {
    var f = FILTERS.filter(function (x) { return x.k === filter; })[0];
    return contacts.filter(f.fn).filter(function (c) {
      return !tagFilter || tagsOf(c).indexOf(tagFilter) >= 0;
    });
  }

  function enterFocus(c) {
    focusList = currentList();
    focusIdx = focusList.indexOf(c);
    if (focusIdx < 0) { focusList = [c]; focusIdx = 0; }
    document.getElementById('focus').hidden = false;
    document.body.style.overflow = 'hidden';
    renderFocus();
  }
  function exitFocus() {
    document.getElementById('focus').hidden = true;
    document.body.style.overflow = '';
    focusIdx = -1;
    paint();
  }
  function focusNext() {
    if (focusIdx + 1 >= focusList.length) { exitFocus(); return; }
    focusIdx++; renderFocus();
  }

  function el2(id) { return document.getElementById(id); }

  function renderFocus() {
    var c = focusList[focusIdx];
    if (!c) { exitFocus(); return; }
    var money = isMoneyCall(c);

    var d = tagsOf(c).length ? tagDef(tagsOf(c)[0]) : null;
    el2('fProg').textContent = (focusIdx + 1) + ' of ' + focusList.length +
      (d ? ' \u00B7 ' + d.label : '');
    el2('fBar').style.width = Math.round(((focusIdx + 1) / focusList.length) * 100) + '%';

    var pri = el2('fPri');
    pri.textContent = c.priority || '\u2013';
    pri.className = 'fpri' + (c.priority === '1' ? ' p1' : '');
    el2('fName').textContent = c.name || 'Unnamed';

    var tag = el2('fTag');
    if (d) { tag.textContent = d.label; tag.style.setProperty('--tc', d.color); tag.hidden = false; }
    else { tag.hidden = true; }

    var tel = el2('fTel');
    if (c.phone) {
      tel.textContent = fmtPhone(c.phone);
      tel.href = 'tel:' + String(c.phone).replace(/[^\d+]/g, '');
      tel.className = 'focus-tel';
    } else {
      tel.textContent = 'No phone number'; tel.removeAttribute('href');
      tel.className = 'focus-tel none';
    }
    var mail = el2('fMail');
    mail.textContent = c.email || '';
    mail.href = c.email ? 'mailto:' + c.email : '';
    mail.hidden = !c.email;

    el2('fWho').value = c.notes || '';

    // The ask, and the one fact worth saying alongside it.
    el2('fAsk').innerHTML = money
      ? '<b>$60 maximum</b> \u00B7 per donor'
      : '<b>Endorsement vote</b>';
    var sideL = el2('fSideLabel'), side = el2('fSide');
    if (money) {
      sideL.textContent = 'Berkeley';
      side.className = 'fside' + (c.berkeley ? ' on' : '');
      side.innerHTML = c.berkeley
        ? '<b>Berkeley resident</b> \u00B7 matched 6:1 \u00B7 <b>$420</b>'
        : 'Not set \u00B7 matched 6:1 if they are';
    } else {
      sideL.textContent = 'Seat';
      side.className = 'fside on';
      // The note already carries the seat; show its first segment rather than
      // inventing a field the sheet does not have.
      side.textContent = (c.notes || '').split(' \u00B7 ').slice(0, 3).join(' \u00B7 ') || '\u2014';
    }

    // history
    var wrap = el2('fAtts');
    wrap.textContent = '';
    for (var i = 0; i < 3; i++) {
      (function (idx) {
        var a = attemptsOf(c)[idx];
        var b = el('button', 'fatt' + (a ? (a.reached ? ' done reached' : ' done') : ''));
        b.textContent = a ? fmtWhen(a.at) : '+';
        b.addEventListener('click', function () {
          cycleAttempt(c, idx).then(renderFocus);
        });
        wrap.appendChild(b);
      })(i);
    }
    var n = attemptsOf(c).filter(Boolean).length;
    wrap.appendChild(el('span', 'fatt-note', n ? (n === 1 ? 'One attempt' : n + ' attempts') : 'No attempts yet'));

    // first stage
    var o1 = el2('fOut1');
    o1.textContent = '';
    [['No answer', false], ['Left message', false], ['Talked', true]].forEach(function (pair) {
      var b = el('button', 'fout' + (pair[1] && c.status ? ' on' : ''), pair[0]);
      b.addEventListener('click', function () { logOutcome(c, pair[0], pair[1]); });
      o1.appendChild(b);
    });

    // second stage — only once the call actually connected
    var stage = el2('fStage');
    var reached = attemptsOf(c).some(function (a) { return a && a.reached; });
    stage.hidden = !reached;
    var o2 = el2('fOut2');
    o2.textContent = '';
    (money ? STATUS_MONEY : STATUS_ENDORSE).forEach(function (label) {
      var b = el('button', 'fout' + (c.status === label ? ' on' : ''), label);
      b.addEventListener('click', function () { setStatus(c, label, money); });
      o2.appendChild(b);
    });
    var amt = el2('fAmt');
    amt.hidden = !(money && c.status === 'Gave');
    el2('fAmtIn').value = c.gave_amount == null ? '' : c.gave_amount;

    el2('fNote').value = c.notes || '';
  }

  // "Talked" stamps an attempt as reached; the other two stamp it as tried.
  function logOutcome(c, label, reached) {
    var a = attemptsOf(c).slice();
    var idx = a.filter(Boolean).length;
    if (idx > 2) idx = 2;
    a[idx] = { at: new Date().toISOString(), reached: !!reached };
    c.attempts = a;
    if (!reached && label === 'Left message') c.notes = c.notes;   // no note change
    patch(c.id, { attempts: a });
    renderFocus();
  }

  function setStatus(c, label, money) {
    c.status = (c.status === label) ? '' : label;
    var fields = { status: c.status };
    if (money) {
      var gave = c.status === 'Gave';
      if (gave !== c.gave) {
        c.gave = gave;
        c.gave_on = gave ? new Date().toISOString().slice(0, 10) : null;
        fields.gave = c.gave; fields.gave_on = c.gave_on;
      }
    }
    patch(c.id, fields);
    renderFocus();
  }

  function setSetupNotice(msg, kind) {
    var box = document.getElementById('setupNotice');
    box.textContent = '';
    if (!msg) { box.style.display = 'none'; return; }
    box.style.display = '';
    box.appendChild(el('div', 'setup-banner' + (kind ? ' ' + kind : ''), msg));
  }

  function paint() {
    buildFilters();
    buildTagFilters();
    render();
  }

  async function refresh() {
    try {
      // load() owns the notice: it is the only thing that knows whether the
      // rows came from the sheet or the fallback, so clearing it here would
      // wipe the "backup copy" warning the moment it was set.
      // paint() runs twice on a normal load: once on the mirror so the list is
      // usable immediately, once when the sheet lands and replaces it.
      await load(paint);
    } catch (e) {
      if (e && (e.code === 'PGRST205' || /schema cache/i.test(e.message || ''))) {
        setSetupNotice('The call_contacts table does not exist yet. Run calltime_setup.sql ' +
                       'in the Supabase SQL Editor, then reload this page.');
      } else {
        setSave('error', 'Load failed');
      }
    }
    paint();
  }

  // Anything unsent from a previous session comes back before the first flush,
  // so a phone that died mid-call picks up exactly where it stopped.
  loadQueue();
  if (queue.length) pendingNote();

  var legend = document.getElementById('legend');
  if (localStorage.getItem('calltimeKey') === 'open') legend.open = true;
  legend.addEventListener('toggle', function () {
    localStorage.setItem('calltimeKey', legend.open ? 'open' : 'closed');
  });

  // --- focus wiring ---
  document.getElementById('fClose').addEventListener('click', exitFocus);
  document.getElementById('fNext').addEventListener('click', focusNext);
  document.getElementById('fSkip').addEventListener('click', focusNext);
  document.addEventListener('keydown', function (e) {
    if (document.getElementById('focus').hidden) return;
    if (e.key === 'Escape') exitFocus();
    // Enter advances, but not while someone is mid-sentence in a note.
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) focusNext();
  });
  // Notes and the who-they-are field are the same cell; both write on blur so a
  // half-typed thought is never queued.
  ['fNote', 'fWho'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', function () {
      var c = focusList[focusIdx];
      if (!c) return;
      c.notes = this.value.trim();
      document.getElementById(id === 'fNote' ? 'fWho' : 'fNote').value = c.notes;
      patch(c.id, { notes: c.notes });
    });
  });
  document.getElementById('fAmtIn').addEventListener('change', function () {
    var c = focusList[focusIdx];
    if (!c) return;
    var v = this.value === '' ? null : Math.max(0, Math.min(60, Number(this.value)));
    this.value = v == null ? '' : v;
    c.gave_amount = v;
    patch(c.id, { gave_amount: v });
  });

  var startBtn = document.getElementById('startBtn');
  startBtn.addEventListener('click', function () {
    var list = currentList();
    if (!list.length) { setSave('error', 'Nothing to call'); return; }
    enterFocus(list[0]);
  });

  document.getElementById('addBtn').addEventListener('click', addContact);

  // The sheet is edited elsewhere — in Drive, by someone reprioritising — so the
  // page needs a way to pick that up without a full reload and re-auth.
  var syncBtn = document.getElementById('syncBtn');
  syncBtn.addEventListener('click', async function () {
    syncBtn.disabled = true;
    var was = syncBtn.textContent;
    syncBtn.textContent = 'Reading…';
    setSave('saving', 'Reading sheet');
    await refresh();
    syncBtn.textContent = was;
    syncBtn.disabled = false;
    setSave(SHEET.live ? 'saved' : 'error', SHEET.live ? 'Up to date' : 'Sheet unreachable');
  });

  var booted = false;
  async function showApp() {
    if (booted) return;
    booted = true;
    document.getElementById('authGate').style.display = 'none';
    document.getElementById('app').style.display = '';
    await refresh();
  }

  async function doAuth() {
    var pass = document.getElementById('authPass').value.trim();
    var err = document.getElementById('authError');
    var btn = document.getElementById('authBtn');
    if (!pass) { err.textContent = 'Enter the passphrase.'; err.style.display = 'block'; return; }
    btn.disabled = true; btn.textContent = 'Signing in...';
    try {
      var r = await sb.auth.signInWithPassword({ email: AUTH_EMAIL, password: pass });
      if (r.error) throw r.error;
      showApp();
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Sign in';
      err.textContent = 'Wrong passphrase.'; err.style.display = 'block';
    }
  }
  document.getElementById('authBtn').addEventListener('click', doAuth);
  document.getElementById('authPass').addEventListener('keydown', function (e) { if (e.key === 'Enter') doAuth(); });
  // The Cloudflare edge gate hands us the login once its passcode has been
  // accepted, so the team types one code rather than two. Falls back to the
  // passphrase box whenever that endpoint is absent — local files, GitHub
  // Pages, or any host without the middleware.
  async function edgeSignIn() {
    try {
      var r = await fetch('/__hq/session', { cache: 'no-store', credentials: 'same-origin' });
      if (!r.ok) return false;
      var j = await r.json();
      if (!j || !j.password) return false;
      var a = await sb.auth.signInWithPassword({ email: j.email, password: j.password });
      if (a.error) return false;
      showApp();
      return true;
    } catch (e) { return false; }
  }

  sb.auth.getSession().then(async function (r) {
    if (r.data && r.data.session) { showApp(); return; }
    await edgeSignIn();
  });
})();
</script>
</body>
</html>
